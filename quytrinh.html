<style>
:root{

  --amber:#B87400;--amber-soft:#FBEFD6;--red:#B42A25;--red-soft:#F8E1E0;--green:#2B7249;--green-soft:#DDEFE4;--head:#F3F6F8;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1821;--paper:#15222D;--side:#0A121A;--side-ink:#9FB0BD;--ink:#E4EAEF;--muted:#9AA8B3;--line:#2A3A47;
  --amber:#F0B040;--amber-soft:#35290F;--red:#F07B75;--red-soft:#3A1918;--green:#6CC895;--green-soft:#15301F;--head:#1B2B38;}}
:root[data-theme="dark"]{
  --bg:#0E1821;--paper:#15222D;--side:#0A121A;--side-ink:#9FB0BD;--ink:#E4EAEF;--muted:#9AA8B3;--line:#2A3A47;
  --amber:#F0B040;--amber-soft:#35290F;--red:#F07B75;--red-soft:#3A1918;--green:#6CC895;--green-soft:#15301F;--head:#1B2B38;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,Arial,sans-serif}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}

aside{background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
aside .brand{color:#fff;font-weight:700;font-size:17px;padding:4px 10px 16px;display:flex;align-items:center;gap:10px}
aside .brand i{width:12px;height:12px;border-radius:50%;background:#F0B040;box-shadow:0 0 0 5px rgba(240,176,64,.25)}
aside button{all:unset;cursor:pointer;padding:9px 10px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
aside button:hover{background:rgba(255,255,255,.06);color:#fff}
aside button.on{background:rgba(240,176,64,.16);color:#fff;box-shadow:inset 3px 0 0 #F0B040}
aside button:focus-visible{outline:2px solid #F0B040}
aside .bd{background:#B42A25;color:#fff;border-radius:10px;font-size:12px;padding:0 7px;font-weight:600}
aside .sp{flex:1}

main{overflow:auto;padding:22px 26px 60px}
@media (max-width:760px){main{padding:16px 12px 60px}}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;max-width:80ch}
h2{font-size:16px;margin:22px 0 10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.kpi b{display:block;font-size:28px;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.kpi.r{border-left:4px solid var(--red)}.kpi.a{border-left:4px solid var(--amber)}.kpi.g{border-left:4px solid var(--green)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--paper);max-height:62vh}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
td.w{white-space:normal;min-width:180px}
th{background:var(--head);position:sticky;top:0;font-weight:600;z-index:1}
td.n,th.n{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--head)}
.pill{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;margin:1px 2px 1px 0}
.pg{background:var(--green-soft);color:var(--green)}.pa{background:var(--amber-soft);color:var(--amber)}.pr{background:var(--red-soft);color:var(--red)}.pn{background:var(--head);color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button.b,label.b{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:4px}
button.b:hover,label.b:hover{border-color:var(--amber)}
button.p{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:600}
:root[data-theme="dark"] button.p{color:#14222E}

button.d{color:var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.b:focus-within{outline:2px solid var(--amber);outline-offset:1px}

.drop{border:2px dashed var(--line);border-radius:6px;padding:26px;text-align:center;color:var(--muted);background:var(--paper)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}

.grid .full{grid-column:1/-1}

#userBox .ub{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}#userBox .ub button{font:inherit;font-size:12px;background:transparent;color:var(--side-ink);border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:3px 8px;cursor:pointer}
#syncBox{display:block;padding:0 10px 6px;font-size:12px}

.att.ro [data-cam],.att.ro label.b,.att.ro .x,.att.ro-del .x[data-del]{display:none}

  body.r-theodoi #tabs{grid-template-columns:repeat(4,1fr)}
  #tabs button{all:unset;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:7px 0 6px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
  #tabs button.on{color:var(--amber);font-weight:600}#tabs svg{width:22px;height:22px}
  #tabs .c{width:44px;height:44px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;margin-top:-20px;font-size:26px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  #tabs em{position:absolute;top:3px;left:calc(50% + 6px);background:#B42A25;color:#fff;border-radius:9px;font-size:10px;font-style:normal;padding:0 5px}
  input,select,textarea{font-size:16px!important}
  .b{min-height:40px}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0}

  dialog form{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 24px)}
  h1{font-size:19px}.hbar{float:none;justify-content:flex-end}

  .toasts{bottom:calc(80px + env(safe-area-inset-bottom,0px))!important;right:8px;left:8px;max-width:none}
  .tw{-webkit-overflow-scrolling:touch}
  #login{padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
}
@media (display-mode: standalone){body{-webkit-user-select:none;user-select:none}input,textarea,td,p,.msg{-webkit-user-select:text;user-select:text}}
ol.hl{margin:6px 0;padding-left:22px}ol.hl li{margin:4px 0}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
details.hd summary{cursor:pointer}
@media print{aside,#nav,.hbar,.bar,.toasts{display:none!important}.app{display:block}details.hd{break-inside:avoid}}
input::placeholder{color:var(--muted);opacity:.75;font-style:italic}
#viewer img{max-width:100%;max-height:78vh;display:block;margin:0 auto}
.inb img{width:64px;height:48px;object-fit:cover;border-radius:3px;display:block}
td input.mini{width:80px;padding:3px 6px}
</style>

<script>
/* ================== TIỆN ÍCH ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]/g,'');
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtD=d=>{if(!d)return'';d=new Date(d);return isNaN(d)?'':`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const fmtDT=d=>{if(!d)return'';d=new Date(d);return isNaN(d)?'':`${fmtD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtN=(n,k=2)=>n==null||isNaN(n)?'':Number(n).toLocaleString('vi-VN',{maximumFractionDigits:k});
const fmtP=x=>x==null||!isFinite(x)?'–':(x*100).toLocaleString('vi-VN',{maximumFractionDigits:1})+'%';
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const ymd=d=>{d=new Date(d);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const toLocalInput=d=>{if(!d)return'';d=new Date(d);return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const endOfDay=d=>{d=new Date(d);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59,999)};
const startOfDay=d=>{d=new Date(d);return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes());}
  const s=String(v).trim();

function detectType(name){const u=name.toUpperCase();for(const t of ['1022','PLVT','PN','PX','KLN','KHT','KHQ','GOI','SUCO'])if(new RegExp('(^|[_\\-\\s])'+t+'([_\\-\\s.]|$)').test(u))return t;return''}
function mapHeaders(headers,spec){
  const map={},used=new Set();
  for(const [key,label,al] of spec.f){
    const cands=[norm(label),...al];let hit=headers.find(h=>!used.has(h)&&cands.includes(norm(h)));
    if(!hit)hit=headers.find(h=>!used.has(h)&&cands.some(a=>a.length>=5&&norm(h).includes(a)));
    if(hit){map[key]=hit;used.add(hit)}
  }return map}
function kyFrom(loai,raw,fileDate){
  const s=String(raw??'').trim();
  if(loai==='KHT'){let m=s.match(/(\d{1,2})\s*[\/\-.]\s*(\d{4})/);if(m)return`${m[2]}-${pad(m[1])}`;m=s.match(/(\d{4})-(\d{1,2})/);if(m)return`${m[1]}-${pad(m[2])}`;if(typeof raw==='number'&&raw>1000){const d=parseDate(raw);return`${d.getFullYear()}-${pad(d.getMonth()+1)}`}
    return fileDate?`${fileDate.getFullYear()}-${pad(fileDate.getMonth()+1)}`:''}
  let m=s.match(/Q\s*([1-4])\s*[\/\-.\s]*(\d{4})/i)||s.match(/qu[yý]\s*([1-4])\D*(\d{4})/i);if(m)return`${m[2]}-Q${m[1]}`;
  m=s.match(/(\d{4})\s*-?\s*Q([1-4])/i);if(m)return`${m[1]}-Q${m[2]}`;
  return fileDate?`${fileDate.getFullYear()}-Q${Math.floor(fileDate.getMonth()/3)+1}`:''
}

/* ================== KHO: TÍNH TỒN ================== */
function tonTai(maVT,kho,ngay,exclId){
  const end=endOfDay(ngay).getTime();let t=0;
  S.pn.forEach(p=>{if(p.id===exclId||p.kho!==kho||Date.parse(p.ngay)>end)return;p.lines.forEach(l=>{if(l.maVT===maVT)t+=l.sl})});
  S.px.forEach(p=>{if(p.id===exclId||p.kho!==kho||Date.parse(p.ngay)>end)return;p.lines.forEach(l=>{if(l.maVT===maVT)t-=l.sl})});
  return t;
}
function kiemTraVuotTon(p){
  const need={};p.lines.forEach(l=>need[l.maVT]=(need[l.maVT]||0)+l.sl);
  return Object.entries(need).map(([vt,sl])=>({vt,sl,ton:tonTai(vt,p.kho,p.ngay,p.id)})).filter(x=>x.sl>x.ton);
}
function tonKho(kho,from,to){
  const f=startOfDay(from).getTime(),t=endOfDay(to).getTime();const M=new Map();
  const g=l=>{let r=M.get(l.maVT);if(!r){const d=S.dmvt.find(x=>x.maVT===l.maVT)||{};r={maVT:l.maVT,tenVT:d.tenVT||l.tenVT||'',dvt:d.dvt||l.dvt||'',tonMin:d.tonMin||0,dau:0,nhap:0,xTC:0,xKhac:0};M.set(l.maVT,r)}return r};
  S.dmvt.forEach(d=>g(d));
  S.pn.forEach(p=>{if(kho&&p.kho!==kho)return;const x=Date.parse(p.ngay);if(x>t)return;p.lines.forEach(l=>{const r=g(l);if(x<f)r.dau+=l.sl;else r.nhap+=l.sl})});
  S.px.forEach(p=>{if(kho&&p.kho!==kho)return;const x=Date.parse(p.ngay);if(x>t)return;p.lines.forEach(l=>{const r=g(l);if(x<f)r.dau-=l.sl;else if(p.loai==='Thi công')r.xTC+=l.sl;else r.xKhac+=l.sl})});
  return[...M.values()].map(r=>{r.cuoi=r.dau+r.nhap-r.xTC-r.xKhac;r.flags=[];if(r.cuoi<0)r.flags.push(['Âm kho','pr']);else if(r.tonMin>0&&r.cuoi<r.tonMin)r.flags.push(['Dưới mức tối thiểu','pa']);return r}).sort((a,b)=>b.flags.length-a.flags.length||a.maVT.localeCompare(b.maVT));
}
function theKho(maVT,kho){
  const mv=[];
  S.pn.forEach(p=>{if(kho&&p.kho!==kho)return;p.lines.forEach(l=>{if(l.maVT===maVT)mv.push({ngay:p.ngay,so:p.soPhieu,loai:'Nhập: '+p.loai,kho:p.kho,maSC:l.maSC||p.maSC||'',nguoi:p.nguoi,n:l.sl,x:0,o:0})})});
  S.px.forEach(p=>{if(kho&&p.kho!==kho)return;p.lines.forEach(l=>{if(l.maVT===maVT)mv.push({ngay:p.ngay,so:p.soPhieu,loai:'Xuất: '+p.loai,kho:p.kho,maSC:l.maSC||p.maSC||'',nguoi:p.nguoi,n:0,x:l.sl,o:1})})});
  mv.sort((a,b)=>Date.parse(a.ngay)-Date.parse(b.ngay)||a.o-b.o);let t=0;mv.forEach(m=>{t+=m.n-m.x;m.ton=t});return mv;
}
function chuyenPLVTcu(rows){
  const g=new Map();rows.forEach(r=>{let p=g.get(r.soPhieu);if(!p){p={id:uid(),soPhieu:r.soPhieu,ngay:r.ngay,loai:'Thi công',kho:'Kho chính',maSC:r.maSC||'',nguoi:r.nguoiLanh||'',ghiChu:'',lines:[],_file:r._file||''};g.set(r.soPhieu,p)}

async function importFile(file,loai,b){
  if(ROLE()!=='admin'&&['KHT','KHQ','GOI'].includes(loai))throw new Error('Chỉ quản trị được nạp kế hoạch, tổng gói');
  if(ROLE()==='theodoi')throw new Error('Tài khoản theo dõi không nạp dữ liệu');
  if(typeof XLSX==='undefined')throw new Error('Chưa tải được thư viện đọc Excel. Kiểm tra kết nối mạng rồi mở lại app.');
  const spec=SPEC[loai];const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
  const headers=rows.length?Object.keys(rows[0]):[];const map=mapHeaders(headers,spec);

  const good=[];

    const o={};for(const [k] of spec.f)if(map[k])o[k]=r[map[k]];
    if(Object.values(o).every(v=>String(v).trim()===''))return;
    const miss=spec.f.filter(f=>f[3]&&String(o[f[0]]??'').trim()==='').map(f=>f[1]);
    if(miss.length){res.loi.push({dong:i+2,ly:'Trống: '+miss.join(', ')});return}
    for(const k of ['kl','sl','slHoan','slSD','slThuHoi','donGia']){if(k in o){if(String(o[k]??'').trim()===''){o[k]=0;continue}const v=num(o[k]);if(isNaN(v)){res.loi.push({dong:i+2,ly:`Giá trị số không hợp lệ ở cột ${spec.f.find(f=>f[0]===k)[1]}`});return}o[k]=v}}
    for(const k of ['tn','ngay','hanXuLy']){if(k in o&&String(o[k]??'').trim()!==''){const d=parseDate(o[k]);if(!d){res.loi.push({dong:i+2,ly:`Ngày giờ không đọc được: "${o[k]}"`});return}o[k]=d.toISOString()}}
    for(const k in o)if(typeof o[k]==='string')o[k]=o[k].trim();
    if('soPhieu' in o)o.soPhieu=String(o.soPhieu).trim();if('maVT' in o)o.maVT=normMa(o.maVT);if('maSC' in o)o.maSC=normMa(o.maSC);if('dvt' in o)o.dvt=normDVT(o.dvt);
    o._dong=i+2;good.push(o)});
  const F=file.name;
  if(loai==='SUCO'||loai==='1022'){
    for(const o of good){
      let ex=loai==='1022'?S.suco.find(x=>x.so1022&&x.so1022===String(o.so1022)):(o.ma?S.suco.find(x=>x.ma===o.ma):null);
      if(ex){for(const k in o)if(k!=='_dong'&&o[k]!==''&&k!=='trangThai')ex[k]=o[k];if(o.trangThai&&TRANG_THAI.includes(o.trangThai))ex.trangThai=o.trangThai;res.ok++;continue}
      const x={ma:o.ma||genMa(o.tn,o.quan),nguon:loai==='1022'?'1022':'App/Tuần tra',so1022:loai==='1022'?String(o.so1022):'',tn:o.tn,quan:o.quan||'',tu:o.tu||'',tru:o.tru||'',diaChi:o.diaChi||'',hienTuong:o.hienTuong||'',nguyenNhan:o.nguyenNhan||'',nguoiGhi:o.nguoiGhi||'',nguoi:o.nguoi||'',anh:o.anh||'',hanXuLy:o.hanXuLy||'',trangThai:TRANG_THAI.includes(o.trangThai)?o.trangThai:'Mới',tgXong:'',lyDoTon:'',bbLink:'',ghiChu:''};
      const g=goiYBienBan(x);x.canBB=g.can;x.lyDoBB=g.ly;x.nhom=loai==='1022'?'1022':(g.can?'DTKTX':'DTTX');
      if(DONE.includes(x.trangThai))x.tgXong=new Date().toISOString();

    const G=new Map(),HN=new Map();

      p.lines.push({maVT:o.maVT,tenVT:o.tenVT||'',dvt:o.dvt||'',sl:o.sl,donGia:o.donGia||0,maSC:o.maSC||''});
      if(loai==='PLVT'&&o.slHoan>0){const k='HN-'+o.soPhieu;let h=HN.get(k);if(!h){h={id:uid(),soPhieu:k,ngay:o.ngay,loai:'Hoàn nhập',kho:p.kho,maSC:o.maSC||'',nguoi:o.nguoi||'',ghiChu:'Hoàn nhập từ phiếu '+o.soPhieu,pxGoc:o.soPhieu,lines:[],_file:F,_b:b};HN.set(k,h)}h.lines.push({maVT:o.maVT,tenVT:o.tenVT||'',dvt:o.dvt||'',sl:o.slHoan,donGia:0,maSC:o.maSC||''})}

const REF_TEN={suco:'Sự cố',pn:'Phiếu nhập',px:'Phiếu xuất',lo:'Lần nạp'};
async function nenAnh(f){
  if(!/^image\/(jpeg|png|webp|bmp)/.test(f.type))return f;
  try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));return b&&b.size<f.size?b:f}catch(e){return f}
}
async function luuDinhKem(refType,refId,file,ghiChu){
  const blob=await nenAnh(file);const id=uid();await putBlob(id,blob);
  S.files.push({id,refType,refId,ten:file.name||('anh-'+id+'.jpg'),type:blob.type||file.type||'',size:blob.size,ngay:new Date().toISOString(),ghiChu:ghiChu||''});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}

    if(files.length>room)toast('Vượt giới hạn '+MAX_ANH+' ảnh/file',room>0?`Chỉ thêm ${room} file đầu tiên.`:'Mục này đã đủ '+MAX_ANH+' file. Xóa bớt trước khi thêm.');

function soSanh(d){
  const y=d.getFullYear(),m=d.getMonth(),q0=Math.floor(m/3)*3;
  const mS=new Date(y,m,1),qS=new Date(y,q0,1),qE=new Date(y,q0+3,0),end=endOfDay(d);
  const kyT=`${y}-${pad(m+1)}`,kyQ=`${y}-Q${q0/3+1}`,kyTQ=[0,1,2].map(i=>`${y}-${pad(q0+i+1)}`);
  const dim=new Date(y,m+1,0).getDate(),ptT=d.getDate()/dim,ptQ=(dayDiff(qS,d)+1)/(dayDiff(qS,qE)+1),conNgay=Math.max(1,dim-d.getDate()+1);
  let ptG=null,gS=null;
  if(S.cfg.goiBatDau&&S.cfg.goiKetThuc){gS=parseDate(S.cfg.goiBatDau);const gE=parseDate(S.cfg.goiKetThuc);ptG=Math.min(1,Math.max(0,(dayDiff(gS,d)+1)/(dayDiff(gS,gE)+1)))}
  const M=new Map();const get=(k,src)=>{let r=M.get(k);if(!r){r={maCV:k,tenCV:'',dvt:'',donGia:0,nhom:'',lkT:0,lkQ:0,lkG:0,khT:0,khQd:0,khQm:0,hasQ:false,klG:0,trongGoi:false,dvtKhac:new Set()};M.set(k,r)}if(src){r.tenCV||=src.tenCV||'';r.dvt||=src.dvt||'';if(!r.donGia&&src.donGia)r.donGia=src.donGia;if(!r.nhom&&src.nhom)r.nhom=src.nhom}return r};
  S.goi.forEach(g=>{if(!g.maCV)return;const r=get(g.maCV,g);r.klG+=g.kl||0;r.trongGoi=true;if(g.donGia)r.donGia=g.donGia;if(g.nhom)r.nhom=g.nhom;if(g.dvt)r.dvt=g.dvt;if(g.tenCV)r.tenCV=g.tenCV});
  S.kh.forEach(k=>{if(!k.maCV)return;if(k.loai==='T'&&k.ky===kyT)get(k.maCV,k).khT+=k.kl||0;if(k.loai==='Q'&&k.ky===kyQ){const r=get(k.maCV,k);r.khQd+=k.kl||0;r.hasQ=true}if(k.loai==='T'&&kyTQ.includes(k.ky))get(k.maCV,k).khQm+=k.kl||0});
  S.kln.forEach(r=>{if(r.xacNhan===false||!r.maCV)return;const t=Date.parse(r.ngay);if(isNaN(t)||t>end)return;if(gS&&t<gS)return;const x=get(r.maCV,r);if(r.dvt&&x.dvt&&normDVT(r.dvt)!==normDVT(x.dvt))x.dvtKhac.add(r.dvt);x.lkG+=r.kl||0;if(t>=qS)x.lkQ+=r.kl||0;if(t>=mS)x.lkT+=r.kl||0});
  const rows=[];const tot={};const T=n=>tot[n]||(tot[n]={lkT:0,khT:0,lkQ:0,khQ:0,lkG:0,klG:0,conG:0,conT:0,conQ:0});
  for(const r of M.values()){
    r.khQ=r.hasQ?r.khQd:r.khQm;
    if(!(r.lkT||r.lkQ||r.lkG||r.khT||r.khQ||r.klG))continue;
    r.pT=r.khT?r.lkT/r.khT:null;r.pQ=r.khQ?r.lkQ/r.khQ:null;r.pG=r.klG?r.lkG/r.klG:null;
    r.spi=r.pT!=null&&ptT?r.pT/ptT:null;
    r.conT=Math.max(0,r.khT-r.lkT);r.conQ=Math.max(0,r.khQ-r.lkQ);r.conG=r.klG?Math.max(0,r.klG-r.lkG):0;r.canNgay=r.conT/conNgay;
    r.co=[];
    if(r.lkT>0&&!r.khT)r.co.push(['Phát sinh ngoài KH tháng','pr']);
    if(S.goi.length&&!r.trongGoi&&r.lkG>0)r.co.push(['Không có trong gói','pr']);
    if(r.klG&&r.lkG>r.klG)r.co.push(['Vượt gói','pr']);
    else if(r.klG&&ptG!=null&&r.pG>ptG+0.1)r.co.push(['Dùng gói nhanh hơn tiến độ','pa']);
    if(r.spi!=null)r.co.push(r.spi>=0.95?['Đúng tiến độ','pg']:r.spi>=0.8?['Chậm','pa']:['Chậm nhiều','pr']);
    if(r.dvtKhac.size)r.co.push([`ĐVT không khớp gói (${[...r.dvtKhac].join(', ')})`,'pa']);
    const g=r.donGia||0;for(const t of [T(r.nhom||'CHUA'),T('ALL')]){t.lkT+=r.lkT*g;t.khT+=r.khT*g;t.lkQ+=r.lkQ*g;t.khQ+=r.khQ*g;t.lkG+=r.lkG*g;t.klG+=r.klG*g;t.conG+=r.conG*g;t.conT+=r.conT*g;t.conQ+=r.conQ*g}
    rows.push(r)}
  rows.sort((a,b)=>a.maCV.localeCompare(b.maCV));
  return{rows,ptT,ptQ,ptG,kyT,kyQ,tot,conNgay};
}
function vatTuRows(){
  const M=new Map();const scMap=new Map(S.suco.map(x=>[x.ma,x]));
  const g=(sc,vt,l)=>{const k=sc+'|'+vt;let r=M.get(k);if(!r){r={maSC:sc,maVT:vt,tenVT:'',dvt:'',lanh:0,hoan:0,sd:0,th:0,nhapTH:0,phieu:new Set()};M.set(k,r)}if(l){r.tenVT||=l.tenVT||'';r.dvt||=l.dvt||''}return r};
  S.px.forEach(p=>{if(p.loai!=='Thi công')return;p.lines.forEach(l=>{const r=g(l.maSC||p.maSC,l.maVT,l);r.lanh+=l.sl;r.phieu.add(p.soPhieu)})});
  S.pn.forEach(p=>{if(p.loai!=='Hoàn nhập'&&p.loai!=='Thu hồi')return;p.lines.forEach(l=>{const sc=l.maSC||p.maSC;if(!sc)return;const r=g(sc,l.maVT,l);if(p.loai==='Hoàn nhập')r.hoan+=l.sl;else r.nhapTH+=l.sl})});
  S.kln.forEach(k=>{if(!k.maVT)return;const r=g(k.maSC||k.maCV,k.maVT);r.sd+=k.slSD||0;r.th+=k.slThuHoi||0});
  const th=S.cfg.thuHoi.split(',').map(s=>norm(s)).filter(Boolean);const now=Date.now();
  return[...M.values()].map(r=>{
    r.chenh=r.lanh-r.sd-r.hoan;r.flags=[];const sc=scMap.get(r.maSC);r.sc=sc;
    const dongNgay=sc&&isClosed(sc)&&sc.tgXong?(now-Date.parse(sc.tgXong))/864e5:null;
    if(r.lanh===0&&r.sd>0)r.flags.push(['Dùng nhưng không có phiếu xuất','pr']);
    else if(r.chenh>0&&dongNgay!=null&&dongNgay>3)r.flags.push([`Dư ${fmtN(r.chenh)} chưa hoàn nhập (đóng ${Math.floor(dongNgay)} ngày)`,'pr']);
    else if(r.chenh<0)r.flags.push([`Dùng vượt xuất ${fmtN(-r.chenh)}`,'pr']);
    if(th.some(p=>norm(r.maVT).startsWith(p))&&r.sd>r.th)r.flags.push([`Thiếu thu hồi ${fmtN(r.sd-r.th)}`,'pa']);
    if(r.th>r.nhapTH&&dongNgay!=null&&dongNgay>3)r.flags.push([`Thu hồi ${fmtN(r.th-r.nhapTH)} chưa nhập kho`,'pa']);
    return r}).filter(r=>r.lanh||r.sd||r.hoan||r.th).sort((a,b)=>b.flags.length-a.flags.length||a.maSC.localeCompare(b.maSC));
}

s1022(){
  const now=new Date();const from=ky1022==='hom'?startOfDay(now):ky1022==='7'?new Date(now-7*864e5):ky1022==='thang'?new Date(now.getFullYear(),now.getMonth(),1):new Date(0);
  const all=S.suco.filter(x=>x.nhom==='1022');const open=all.filter(x=>!isClosed(x)).sort((a,b)=>ageH(b)-ageH(a));
  const R=new Map();const g=q=>{if(!R.has(q))R.set(q,{q,tn:0,xl:0,chua:0,c24:0,c48:0,ly:{}});return R.get(q)};
  all.forEach(x=>{const r=g(x.quan||'(chưa rõ)');if(Date.parse(x.tn)>=from){r.tn++;if(isDone(x))r.xl++}
    if(!isDone(x)){r.chua++;const h=ageH(x);if(h>=48)r.c48++;else if(h>=24)r.c24++;const l=(x.trangThai||'').startsWith('Tạm dừng')?x.trangThai.replace('Tạm dừng: ',''):(x.lyDoTon||'');if(l)r.ly[l]=(r.ly[l]||0)+1}});
  const rows=[...R.values()].sort((a,b)=>a.q.localeCompare(b.q,'vi',{numeric:true}));const T=rows.reduce((t,r)=>{['tn','xl','chua','c24','c48'].forEach(k=>t[k]+=r[k]);return t},{tn:0,xl:0,chua:0,c24:0,c48:0});
  const perm='Notification' in window?Notification.permission:'unsupported';
  window._bc1022={rows,T};
  return`<h1>Sự cố 1022 (cấp bách)</h1><p class="sub">App tự nhắc lặp lại mọi phiếu 1022 chưa "Đã đóng" theo nhịp: trong hạn ${S.cfg.nhip.thuong} phút, tồn &gt;24h ${S.cfg.nhip.qua24} phút, tồn &gt;48h ${S.cfg.nhip.qua48} phút, đã xử lý chờ đóng ${S.cfg.nhip.choDong} phút. Nhắc chạy khi cửa sổ app đang mở (thu nhỏ vẫn được).</p>
  <div class="bar">${perm==='granted'?'<span class="pill pg">Thông báo Windows: đang bật</span>':perm==='denied'?'<span class="pill pr">Thông báo Windows bị chặn – mở lại quyền trong cài đặt trang của trình duyệt</span>':perm==='unsupported'?'<span class="pill pa">Trình duyệt không hỗ trợ thông báo – chỉ hiện trong app</span>':'<button class="b p" id="perm">Bật thông báo Windows</button>'}
    <button class="b" id="thuNhac">Kiểm tra nhắc ngay</button><button class="b" id="am">${S.cfg.amThanh?'Tắt âm thanh':'Bật âm thanh'}</button></div>
  <h2>Báo cáo theo quận</h2>
  <div class="bar"><select id="ky1022">${opts([['hom','Tiếp nhận hôm nay'],['7','7 ngày qua'],['thang','Tháng này'],['all','Toàn bộ']],ky1022)}</select><button class="b" id="xuatBC">Xuất báo cáo Excel</button></div>
  <div class="tw"><table><thead><tr><th>Quận</th><th class="n">Tiếp nhận trong kỳ</th><th class="n">Đã xử lý (trong số tiếp nhận)</th><th class="n">Chưa xử lý (toàn bộ)</th><th class="n">Tồn 24–48h</th><th class="n">Tồn &gt;48h</th><th>Lý do tồn</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.q)}</td><td class="n">${r.tn}</td><td class="n">${r.xl}</td><td class="n">${r.chua}</td><td class="n">${r.c24?`<span class="pill pa">${r.c24}</span>`:0}</td><td class="n">${r.c48?`<span class="pill pr">${r.c48}</span>`:0}</td><td class="w">${Object.entries(r.ly).map(([k,v])=>`${esc(k)} (${v})`).join(', ')}</td></tr>`).join('')}
  <tr><td><b>Tổng</b></td><td class="n"><b>${T.tn}</b></td><td class="n"><b>${T.xl}</b></td><td class="n"><b>${T.chua}</b></td><td class="n"><b>${T.c24}</b></td><td class="n"><b>${T.c48}</b></td><td></td></tr></tbody></table></div>
  <h2>Phiếu chưa kết thúc (${open.length})</h2>
  <div class="tw"><table><thead><tr><th>Phiếu 1022</th><th>Mã sự cố</th><th>Tiếp nhận</th><th>Địa chỉ</th><th>Người xử lý</th><th>Trạng thái</th><th>Mức</th><th class="n">Tuổi</th><th class="n">Đã nhắc</th><th>Lý do tồn</th><th></th></tr></thead><tbody>
  ${open.map(x=>{const lv=level(x);return`<tr class="click" data-ma="${esc(x.ma)}"><td>${esc(x.so1022)}</td><td>${esc(x.ma)}</td><td>${fmtDT(x.tn)}</td><td class="w">${esc(x.diaChi)}</td><td>${esc(x.nguoi||'–')}</td><td>${pillTT(x.trangThai)}</td><td><span class="pill ${LV[lv][1]}">${LV[lv][0]}</span></td><td class="n">${fmtN(ageH(x),1)}h</td><td class="n">${x.soLanNhac||0}</td><td class="w">${esc(x.lyDoTon)}</td><td>${clip(soAnh('suco',x.ma))}</td></tr>`}).join('')||'<tr><td colspan="11" class="muted">Không có phiếu 1022 nào đang mở.</td></tr>'}
  </tbody></table></div>`},

  ${R.map(r=>`<tr class="click" data-vt="${esc(r.maVT)}"><td>${chk(r.maVT,'vt')}</td><td>${esc(r.maVT)}</td><td class="w">${esc(r.tenVT)}</td><td>${esc(r.dvt)}</td><td class="n">${fmtN(r.dau)}</td><td class="n">${fmtN(r.nhap)}</td><td class="n">${fmtN(r.xTC)}</td><td class="n">${fmtN(r.xKhac)}</td><td class="n"><b>${fmtN(r.cuoi)}</b></td><td class="n"><input class="mini" type="number" min="0" data-min="${esc(r.maVT)}" value="${r.tonMin||''}"></td><td>${r.flags.map(f=>`<span class="pill ${f[1]}">${f[0]}</span>`).join('')||'<span class="pill pg">Đủ</span>'}</td></tr>`).join('')||'<tr><td colspan="11" class="muted">Chưa có vật tư. Tạo phiếu nhập (kể cả phiếu "Tồn đầu kỳ") để bắt đầu.</td></tr>'}
  </tbody></table></div>`},

capphat(){
  const f=parseDate(CP.from)||startOfDay(new Date()),t=parseDate(CP.to)||new Date();let days=[];for(let d=startOfDay(f);d<=t&&days.length<62;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))days.push(ymd(d));
  const L=[];S.px.forEach(p=>{if(CP.loai&&p.loai!==CP.loai)return;if(CP.kho&&p.kho!==CP.kho)return;const k=ymd(p.ngay);if(!days.includes(k))return;p.lines.forEach((l,li)=>L.push({ngay:k,p,l,li}))});
  const M=new Map();L.forEach(({ngay,l})=>{let r=M.get(l.maVT);if(!r){const d=S.dmvt.find(x=>x.maVT===l.maVT)||{};r={maVT:l.maVT,tenVT:d.tenVT||l.tenVT,dvt:d.dvt||l.dvt,by:{},tong:0};M.set(l.maVT,r)}r.by[ngay]=(r.by[ngay]||0)+l.sl;r.tong+=l.sl});
  const piv=[...M.values()].sort((a,b)=>a.maVT.localeCompare(b.maVT));const coNgay=days.filter(d=>piv.some(r=>r.by[d]));
  const byDay=new Map();L.forEach(x=>{if(!byDay.has(x.ngay))byDay.set(x.ngay,[]);byDay.get(x.ngay).push(x)});
  window._cp={piv,days:coNgay,L};
  return`<h1>Cấp phát theo ngày</h1><p class="sub">Ghi nhận vật tư cấp phát từng ngày từ các phiếu xuất. Bảng tổng hợp chỉ hiện những ngày có cấp phát; bên dưới là chi tiết từng ngày, bấm vào dòng để mở phiếu. Nhập cấp phát từ sổ, ảnh chụp hoặc file: app gộp theo ngày, người nhận, mã sự cố thành phiếu xuất thi công. Chọn dòng rồi bấm xóa khi ghi sai.</p>
  <div class="bar"><label>Từ <input type="date" id="cpFrom" value="${CP.from}"></label><label>Đến <input type="date" id="cpTo" value="${CP.to}"></label>
    <select id="cpLoai">${opts(LOAI_XUAT,CP.loai,'Tất cả loại xuất')}</select><select id="cpKho">${opts(khoList(),CP.kho,'Tất cả kho')}</select><button class="b p qe" id="capCP">Nhập cấp phát từ ảnh, file</button>${delBtn('cp')}${duyetBtn('cp')}<button class="b" id="xuatCP">Xuất Excel</button></div>
  ${days.length>=62?'<div class="msg a">Chỉ hiển thị 62 ngày đầu của khoảng đã chọn.</div>':''}
  <h2>Tổng hợp vật tư theo ngày</h2>
  <div class="tw"><table><thead><tr><th>Mã VT</th><th>Tên vật tư</th><th>ĐVT</th>${coNgay.map(d=>`<th class="n">${d.slice(8)}/${d.slice(5,7)}</th>`).join('')}<th class="n">Tổng</th></tr></thead><tbody>
  ${piv.map(r=>`<tr><td>${esc(r.maVT)}</td><td>${esc(r.tenVT)}</td><td>${esc(r.dvt)}</td>${coNgay.map(d=>`<td class="n">${r.by[d]?fmtN(r.by[d]):''}</td>`).join('')}<td class="n"><b>${fmtN(r.tong)}</b></td></tr>`).join('')||`<tr><td colspan="${4+coNgay.length}" class="muted">Không có cấp phát trong khoảng này.</td></tr>`}
  </tbody></table></div>
  <h2>Chi tiết từng ngày</h2>

/* ================== XỬ LÝ SỰ KIỆN THEO MÀN HÌNH ================== */
function goiYGan(name){
  const n=norm(name);let best=null;const tr=(t,code,ma)=>{const c=norm(code);if(c.length>=4&&n.includes(c)&&(!best||c.length>best.len))best={t,code:ma||code,len:c.length}};
  S.suco.forEach(x=>{tr('suco',x.ma);if(x.so1022)tr('suco',x.so1022,x.ma)});S.pn.forEach(p=>tr('pn',p.soPhieu));S.px.forEach(p=>tr('px',p.soPhieu));return best;
}
function timRef(t,code){code=String(code||'').trim();if(!code)return null;
  if(t==='suco'){const x=S.suco.find(s=>s.ma===code)||S.suco.find(s=>s.so1022&&s.so1022===code);return x?x.ma:null}
  const p=S[t].find(p=>p.soPhieu===code);return p?p.id:null}
const after={
  import(){
    const add=files=>{[...files].forEach(f=>{if(DOC_EXT.test(f.name))pending.push({file:f,loai:detectType(f.name)});else{const g=goiYGan(f.name);inbox.push({file:f,url:f.type.startsWith('image/')?URL.createObjectURL(f):'',refType:g?g.t:'',code:g?g.code:'',ghiChu:''})}});render()};
    const dz=$('#drop');dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();add(e.dataTransfer.files)};
    $('#fi').onchange=e=>add(e.target.files);
    document.querySelectorAll('[data-pi]').forEach(s=>s.onchange=()=>pending[+s.dataset.pi].loai=s.value);
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{pending.splice(+b.dataset.rm,1);render()});
    document.querySelectorAll('[data-toatt]').forEach(b=>b.onclick=()=>{const p=pending.splice(+b.dataset.toatt,1)[0];const g=goiYGan(p.file.name);inbox.push({file:p.file,url:'',refType:g?g.t:'',code:g?g.code:'',ghiChu:''});render()});
    document.querySelectorAll('[data-it]').forEach(s=>s.onchange=()=>{inbox[+s.dataset.it].refType=s.value;render()});
    document.querySelectorAll('[data-ir]').forEach(s=>s.oninput=()=>inbox[+s.dataset.ir].code=s.value);
    document.querySelectorAll('[data-ig]').forEach(s=>s.oninput=()=>inbox[+s.dataset.ig].ghiChu=s.value);
    document.querySelectorAll('[data-irm]').forEach(b=>b.onclick=()=>{const a=inbox.splice(+b.dataset.irm,1)[0];if(a.url)URL.revokeObjectURL(a.url);render()});
    const ap=$('#ibApply');if(ap)ap.onclick=()=>{const t=$('#ibType').value,r=$('#ibRef').value.trim();inbox.forEach(a=>{if(t)a.refType=t;if(r)a.code=r});render()};
    const gan=$('#ibGan');if(gan)gan.onclick=async()=>{
      gan.disabled=true;gan.textContent='Đang lưu…';const loi=[];let ok=0;const con=[];
      for(const a of inbox){
        if(!a.refType){loi.push(`${a.file.name}: chưa chọn loại mục`);con.push(a);continue}
        const id=timRef(a.refType,a.code);if(!id){loi.push(`${a.file.name}: không tìm thấy ${REF_TEN[a.refType]} "${a.code}"`);con.push(a);continue}
        if(soAnh(a.refType,id)>=MAX_ANH){loi.push(`${a.file.name}: ${REF_TEN[a.refType]} ${a.code} đã đủ ${MAX_ANH} ảnh/file`);con.push(a);continue}
        await luuDinhKem(a.refType,id,a.file,a.ghiChu);ok++;if(a.url)URL.revokeObjectURL(a.url)}
      await save('files');inbox=con;toast(`Đã gán ${ok} ảnh, file`,loi.join('\n'),loi.length?'':'g');render()};
    const di=$('#doImport');if(di)di.onclick=async()=>{
      if(pending.some(p=>!p.loai)){alert('Chọn loại dữ liệu cho tất cả file.');return}

  return new Promise(async resolve=>{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Trình duyệt không mở được camera. Dùng "Chọn ảnh, file" thay thế.');return resolve([])}
    const dlg=document.createElement('dialog');dlg.style.width='min(900px,96vw)';
    dlg.innerHTML=`<div style="padding:12px 14px"><video autoplay playsinline muted style="width:100%;max-height:68vh;background:#000;display:block;border-radius:4px"></video><div class="bar" style="margin:10px 0 0;justify-content:space-between"><span class="muted" data-n>Đưa chứng từ vào khung, giữ thẳng và đủ sáng.</span><span class="bar" style="margin:0"><button class="b p" type="button" data-a="shot">Chụp</button><button class="b" type="button" data-a="done">Xong</button></span></div></div>`;
    document.body.appendChild(dlg);dlg.showModal();const shots=[];let stream=null;
    const done=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());dlg.close();dlg.remove();resolve(shots)};
    dlg.addEventListener('cancel',e=>{e.preventDefault();done()});dlg.querySelector('[data-a=done]').onclick=done;
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}})}catch(e){alert('Không mở được camera: '+e.message);return done()}
    const v=dlg.querySelector('video');v.srcObject=stream;
    dlg.querySelector('[data-a=shot]').onclick=async()=>{if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));

  });
}

function kiemDong(t,r,head){
  const v={},err=[],warn=[],ph={};const F=allF(t);

    if(ty==='n'&&v[k]!==''){const n=typeof v[k]==='number'?v[k]:numLoose(v[k]);if(isNaN(n))err.push(`${l} không phải số`);else v[k]=n}
    if(ty==='d'&&v[k]!==''){const d=parseDate(v[k]);if(!d)err.push(`${l} sai ngày`);else v[k]=d}}
  for(const k of t.req)if(v[k]===''||v[k]==null)err.push('Thiếu '+((F.find(f=>f[0]===k)||[])[1]||k));

    if(g&&!v.dvt&&g.dvt){v.dvt=g.dvt;ph.dvt=g.dvt}
    if(v.dvt)v.dvt=normDVT(v.dvt);
    if(t.k!=='goi'&&S.goi.length&&v.maCV&&!g)warn.push('Mã CV chưa có trong tổng gói');
    if(t.k!=='goi'&&g&&g.dvt&&v.dvt&&normDVT(g.dvt)!==v.dvt)warn.push(`ĐVT khác tổng gói (${g.dvt})`);

    if(v.dvt)v.dvt=normDVT(v.dvt);
    if(d&&d.dvt&&v.dvt&&normDVT(d.dvt)!==v.dvt)warn.push(`ĐVT khác danh mục (${d.dvt})`);
    if(t.k!=='kk'&&typeof v.sl==='number'&&!(v.sl>0))err.push('SL phải lớn hơn 0');
    if(t.k==='kk'&&typeof v.sl==='number'&&v.sl<0)err.push('SL không được âm');
    if(v.maSC)v.maSC=normMa(v.maSC);
    if(t.k==='pn'){v.loai=matchOpt(v.loai,LOAI_NHAP,'Mua mới');if(v.loai==='Hoàn nhập')warn.push('Nên nhập ở mục Nhập hoàn');v.kho=v.kho||(v.loai==='Thu hồi'?'Kho thu hồi':'Kho chính')}

    v.kho=v.kho||'Kho chính';
    if((v.loai==='Thi công'||t.k==='nh')&&!maHopLe(v.maSC))err.push(v.maSC?`Mã SC/HM "${v.maSC}" không có`:'Thiếu mã sự cố/hạng mục');

  }

async function capDoc(){
  const C=CAP;
  for(const s of C.src.filter(s=>s.st==='cho')){
    s.st='dang';drawCap();
    try{
      const r=await docNguon(C.t,s.file,p=>{s.pct=p+'%';const el=document.querySelector(`[data-cs="${C.src.indexOf(s)}"]`);if(el)el.innerHTML=`<span class="pill pa">Đang đọc ${p}%</span>`});
      if(CAP!==C)return;
      const rows=(r.rows||[]).map(o=>{const x={_s:s.id};
        for(const [k] of C.t.f)if(o[k]!=null&&String(o[k]).trim()!=='')x[k]=chuanHoaO(C.t,k,o[k]);
        for(const k of C.t.head)if(!C.t.f.some(f=>f[0]===k)&&o[k]!=null&&String(o[k]).trim()!=='')C.head[k]=String(chuanHoaO(C.t,k,o[k]));
        return x}).filter(x=>Object.keys(x).length>1);
      C.rows.push(...rows);s.n=rows.length;s.st=rows.length?'xong':'loi';if(!rows.length)s.loi='Không đọc được dòng dữ liệu nào.';
      if(r.note)C.notes.push(s.file.name+': '+r.note);
    }catch(e){s.st='loi';s.loi=e.message}
    if(CAP===C)drawCap();
  }
}

  let res;
  try{res=await fetch(SRV.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:SRV.token,...data})})}
  catch(e){throw new Error('Không kết nối được máy chủ (mất mạng hoặc sai địa chỉ)')}
  if(!res.ok)throw new Error('Máy chủ báo lỗi '+res.status);

function danDau(ks){
  if(!SRV.on)return;const now=new Date().toISOString(),R=ROLE();
  for(const k of ks){if(!SYNC_T[k])continue;for(const r of S[k]){if(r._by)continue;r._by=ME();r._byTen=SRV.user.hoTen;r._at=now;
    if(R!=='admin'){if(k==='pn'||k==='px')r.duyet=false;if(k==='kln')r.xacNhan=false;if(k==='suco')r.trangThai='Mới'}}}
}
function tinhThayDoi(){
  const ch=[],seen=new Set();
  for(const k of Object.keys(SYNC_T)){for(const r of S[k]){const id=r[SYNC_T[k]];if(id==null||id==='')continue;const key=k+'|'+id;if(seen.has(key))continue;seen.add(key);const j=JSON.stringify(r);if(SRV.shadow[key]!==j)ch.push({loai:k,id:String(id),data:r,key,j})}}
  if(ROLE()==='admin'){const jc=JSON.stringify(cfgSync());if(SRV.shadow['cfg|main']!==jc)ch.push({loai:'cfg',id:'main',data:cfgSync(),key:'cfg|main',j:jc})}
  for(const key of Object.keys(SRV.shadow))if(!seen.has(key)&&!key.startsWith('cfg|'))ch.push({loai:key.split('|')[0],id:key.slice(key.indexOf('|')+1),data:null,key});
  return ch;
}
function apDungTuXa(list){
  const dirty=new Set();
  for(const c of list){
    const key=c.loai+'|'+c.id;
    if(c.loai==='cfg'){if(c.data){const k0=S.cfg.aiKey,m0=S.cfg.aiModel;S.cfg=Object.assign(structuredClone(DEF_CFG),c.data,{aiKey:k0,aiModel:m0});S.cfg.nhip=Object.assign({},DEF_CFG.nhip,S.cfg.nhip);SRV.shadow[key]=JSON.stringify(cfgSync());DB.set('cfg',S.cfg).catch(()=>{})}continue}
    const k=c.loai;if(!SYNC_T[k])continue;const f=SYNC_T[k],arr=S[k],i=arr.findIndex(r=>String(r[f])===String(c.id));
    if(c.xoa||!c.data){if(i>=0){arr.splice(i,1);if(k==='files')delBlob(c.id)}delete SRV.shadow[key]}
    else{if(i>=0)arr[i]=c.data;else arr.push(c.data);SRV.shadow[key]=JSON.stringify(c.data)}
    dirty.add(k);
  }
  for(const k of dirty)DB.set(k,S[k]).catch(()=>{});
}
let henT=null;
function hen(ms=1500){if(!SRV.on)return;clearTimeout(henT);henT=setTimeout(dongBo,ms)}
async function dongBo(){
  if(!SRV.on)return;if(SRV.busy){hen(4000);return}
  SRV.busy=true;veTT();
  try{
    if(ROLE()!=='theodoi'){let doi=false;
      for(const f of S.files){if(f.driveId||f._khongTai)continue;const b=await getBlob(f.id);if(!b)continue;if(b.size>20*1048576){f._khongTai=1;doi=true;continue}
        const r=await goiSV('upload',{id:f.id,name:f.ten,type:f.type,b64:await toB64(b)});f.driveId=r.driveId;doi=true}
      if(doi)await DB.set('files',S.files);
      const ch=tinhThayDoi();SRV.cho=ch.length;
      for(let i=0;i<ch.length;i+=150){
        const part=ch.slice(i,i+150);
        const r=await goiSV('push',{changes:part.map(c=>({loai:c.loai,id:c.id,data:c.data}))});
        part.forEach(c=>{if(c.data)SRV.shadow[c.key]=c.j;else delete SRV.shadow[c.key]});
        if(r.moi&&r.moi.length)apDungTuXa(r.moi);
        if(r.tuChoi&&r.tuChoi.length)toast('Máy chủ không chấp nhận '+r.tuChoi.length+' thay đổi',r.tuChoi.slice(0,6).map(x=>`${x.id}: ${x.ly}`).join('\n'));
        SRV.cho=Math.max(0,SRV.cho-part.length);
      }
    }
    const r=await goiSV('pull',{since:SRV.rev});
    if(r.user&&JSON.stringify(r.user)!==JSON.stringify(SRV.user)){SRV.user=r.user;await DB.set('srv_user',r.user);apDungVaiTro()}
    if(r.changes.length)apDungTuXa(r.changes);
    SRV.rev=r.rev;await DB.set('srv_rev',r.rev);
    if(r.changes.length&&!$('#dlg').open&&!$('#viewer').open&&!(document.activeElement&&document.activeElement.matches('input,select,textarea')))render();
    SRV.loi='';SRV.lanCuoi=new Date();
  }catch(e){SRV.loi=e.message}
  finally{SRV.busy=false;await DB.set('srv_shadow',SRV.shadow).catch(()=>{});veTT()}
}
function veTT(){
  const md=$('#mSync');if(md){md.className=!SRV.on?'':SRV.busy?'dang':SRV.loi?'loi':'ok';md.title=SRV.loi||''}
  const el=$('#syncBox');if(!el)return;
  if(!SRV.on){el.textContent=SRV.url?'Chưa đăng nhập máy chủ':'Chế độ một máy: dữ liệu chỉ ở máy này';return}
  el.innerHTML=SRV.busy?'Đang đồng bộ…':SRV.loi?`<span style="color:#F07B75">Chưa đồng bộ được: ${esc(SRV.loi)}${SRV.cho?` (${SRV.cho} thay đổi chờ gửi)`:''}</span>`:SRV.lanCuoi?'Đã đồng bộ lúc '+SRV.lanCuoi.toTimeString().slice(0,5):'';
}

async function dangNhap(u,p,url){

    }else{SRV.shadow={};SRV.rev=0}
  }

  <div class="card"><h2 style="margin-top:0">Liên kết mời</h2><p class="muted" style="margin-top:0">Gửi liên kết này qua Zalo, email cho người dùng. Mở liên kết là app đã có sẵn địa chỉ máy chủ, chỉ cần nhập tên đăng nhập và mật khẩu.</p><div class="bar" style="margin:0"><input id="tkLink" value="${esc(link)}" readonly style="flex:1;min-width:260px"><button class="b" id="tkCopy">Sao chép</button></div></div>
  <div class="bar"><button class="b p" id="tkAdd">Thêm tài khoản</button><button class="b" id="tkReload">Tải lại danh sách</button></div>
  <div class="tw"><table><thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th>Phạm vi quận</th><th>Trạng thái</th><th>Đăng nhập gần nhất</th><th></th></tr></thead><tbody>
  ${DSU?DSU.map(u=>`<tr><td>${esc(u.u)}</td><td>${esc(u.hoTen)}</td><td><span class="pill ${u.vaiTro==='admin'?'pr':u.vaiTro==='nhaplieu'?'pa':'pn'}">${ROLE_TEN[u.vaiTro]||esc(u.vaiTro)}</span></td><td>${esc(u.phamVi||'Tất cả')}</td><td>${u.trangThai==='Hoạt động'?'<span class="pill pg">Hoạt động</span>':'<span class="pill pr">Khóa</span>'}</td><td>${u.lanCuoi?fmtDT(u.lanCuoi):'<span class="muted">chưa</span>'}</td><td><button class="b" data-tku="${esc(u.u)}">Sửa</button> <button class="b" data-tkp="${esc(u.u)}">Đặt lại mật khẩu</button></td></tr>`).join(''):'<tr><td colspan="7" class="muted">Đang tải…</td></tr>'}

after.taikhoan=()=>{
  if(!SRV.on||ROLE()!=='admin')return;
  const tai=()=>goiSV('users').then(r=>{DSU=r.users;if(cur==='taikhoan')render()}).catch(e=>toast('Không tải được danh sách tài khoản',e.message));
  if(!DSU)tai();
  $('#tkReload').onclick=()=>{DSU=null;render();tai()};
  $('#tkCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#tkLink').value);toast('Đã sao chép liên kết mời','','g')}catch(e){$('#tkLink').select()}};
  $('#tkAdd').onclick=()=>suaUser(null);
  document.querySelectorAll('[data-tku]').forEach(b=>b.onclick=()=>suaUser(DSU.find(u=>u.u===b.dataset.tku)));
  document.querySelectorAll('[data-tkp]').forEach(b=>b.onclick=async()=>{const p=prompt('Mật khẩu tạm mới cho '+b.dataset.tkp+' (tối thiểu 6 ký tự). Người dùng sẽ phải đổi khi đăng nhập:');if(!p)return;try{await goiSV('resetPw',{u:b.dataset.tkp,p});toast('Đã đặt lại mật khẩu','Gửi mật khẩu tạm cho người dùng; các phiên đăng nhập cũ của họ bị đăng xuất.','g')}catch(e){toast('Không đặt lại được',e.message)}});
  $('#nkLoad').onclick=async()=>{try{NK=(await goiSV('nhatKy',{n:300})).rows;render()}catch(e){toast('Không tải được nhật ký',e.message)}};
  const nx=$('#nkXuat');if(nx)nx.onclick=()=>xuat([{ten:'NhatKy',rows:NK.map(r=>({'Thời gian':fmtDT(r[0]),'Người':r[1],'Thao tác':r[2],'Loại':r[3],'Mã':r[4],'Nội dung':r[5]}))}],`${stamp()}_NHATKY.xlsx`);
};
function suaUser(u){
  const moi=!u;u=u||{u:'',hoTen:'',vaiTro:'nhaplieu',phamVi:'',trangThai:'Hoạt động'};
  $('#dlgForm').innerHTML=`<h2 style="margin:0 0 10px">${moi?'Thêm tài khoản':'Sửa tài khoản '+esc(u.u)}</h2><div class="grid">
  <label>Tên đăng nhập<input name="u" value="${esc(u.u)}" ${moi?'':'readonly'} placeholder="vd: dv.binh" autocapitalize="none"></label><label>Họ tên<input name="hoTen" value="${esc(u.hoTen)}"></label>
  <label>Vai trò<select name="vaiTro">${opts([['nhaplieu','Nhập liệu'],['theodoi','Theo dõi'],['admin','Quản trị']],u.vaiTro)}</select></label>
  <label>Phạm vi quận (trống = tất cả)<input name="phamVi" value="${esc(u.phamVi)}" list="dsQuanTK" placeholder="vd: Quận 3, Quận 10"></label>
  ${moi?'<label>Mật khẩu ban đầu (tối thiểu 6 ký tự)<input name="p" value=""></label>':`<label>Trạng thái<select name="trangThai">${opts(['Hoạt động','Khóa'],u.trangThai)}</select></label>`}
  </div><datalist id="dsQuanTK">${quans().map(q=>`<option value="${esc(q)}">`).join('')}</datalist>
  <p class="muted">Nhập liệu: ghi nhận sự cố, lập phiếu, ghi khối lượng; sửa, xóa được dữ liệu của mình khi chưa duyệt. Theo dõi: chỉ xem và xuất Excel. Quản trị: toàn quyền.</p><div id="dlgMsg"></div>
  <div class="bar" style="margin:14px 0 0;justify-content:flex-end"><button class="b" value="cancel">Đóng</button><button class="b p" type="button" id="tkLuu">Lưu</button></div>`;
  const dlg=moDialog();
  $('#tkLuu').onclick=async()=>{const d=Object.fromEntries(new FormData($('#dlgForm')));if(!moi)d.u=u.u;
    try{const r=await goiSV('userSave',{user:d});DSU=r.users;dlg.close();render();toast(moi?'Đã tạo tài khoản':'Đã lưu tài khoản',moi?`Gửi cho người dùng: tên ${d.u.toLowerCase()}, mật khẩu tạm như đã nhập, kèm liên kết mời.`:'','g')}
    catch(e){$('#dlgMsg').innerHTML=`<div class="msg r">${esc(e.message)}</div>`}};
}

async function dangKySW(){

  try{
    swReg=await navigator.serviceWorker.register('qt-sw.js',{scope:'quytrinh'});
    swReg.addEventListener('updatefound',()=>{const w=swReg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='activated'&&navigator.serviceWorker.controller)toast('Đã có phiên bản mới','Đóng hẳn app rồi mở lại, hoặc bấm "Kiểm tra bản mới" ở Cài đặt.','g')})});
    setInterval(()=>swReg.update().catch(()=>{}),3600e3);
  }catch(e){console.log('Không đăng ký được service worker',e)}
}

  XLSX.writeFile(wb,name);
}
