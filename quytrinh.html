/* ================== TỰ XOAY ẢNH, CHẤM ĐIỂM CHỮ ĐỌC ĐƯỢC ================== */
function xoayCanvas(src,g){if(!g)return src;const c=document.createElement('canvas');const d=g===90||g===270;c.width=d?src.height:src.width;c.height=d?src.width:src.height;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(g*Math.PI/180);x.drawImage(src,-src.width/2,-src.height/2);return c}
function huongChu(cv){
  const k=Math.min(1,700/Math.max(cv.width,cv.height)),w=Math.max(1,Math.round(cv.width*k)),h=Math.max(1,Math.round(cv.height*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(cv,0,0,w,h);const d=x.getImageData(0,0,w,h).data;
  const R=new Float64Array(h),C=new Float64Array(w);for(let y=0;y<h;y++)for(let i=0;i<w;i++){const p=(y*w+i)*4;if(d[p]<140){R[y]++;C[i]++}}
  const nhip=a=>{let s=0,t=0;for(let i=1;i<a.length;i++){s+=Math.abs(a[i]-a[i-1]);t+=a[i]}return t?s/t:0};
  return nhip(C)>nhip(R)*1.15?'doc':'ngang';
}
const TU_PHIEU=new Set('phieu xuat nhap kho ngay thang nam so ten vat tu luong don gia cong ty co phan nguoi nhan hang giao thanh tien ly do bo chieu sang cau thuc ma dvt stt ky ho giam doc phong tong cai m mau dia diem tai moi day ong den cap bong driver led tram tru tu dien cb hop day hoan quy cach pham chat hoa cua trang thu khvt lap kem theo tai chinh truong'.split(' '));
function diemChu(t){return tachTu(t).filter(w=>w.length>=2&&TU_PHIEU.has(w)).length}
async function docDaHuong(file,docCv,ghi){
  let base;try{base=await anhSach(file)}catch(e){return docCv(null)}
  const h=huongChu(base);const thu=h==='doc'?[270,90,0,180]:[0,180,270,90];let best={t:'',d:-1,g:0};
  for(const g of thu){ghi(g?`Ảnh bị xoay, đang thử đọc theo hướng ${g}°…`:'Đang đọc chữ trong ảnh…');const t=await docCv(xoayCanvas(base,g),g);const d=diemChu(t);if(d>best.d)best={t,d,g};if(d>=10)break}
  return best.t;
}
async function docOCRMienPhi(file,prog,ghi=()=>{}){
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const wk=await Tesseract.createWorker('vie+eng',1,{logger:m=>{if(m.status==='recognizing text'&&prog)prog(Math.round(m.progress*100))}});
  try{await wk.setParameters({tessedit_pageseg_mode:'4',preserve_interword_spaces:'1'});
    return await docDaHuong(file,async cv=>{const r=await wk.recognize(cv||await nenAnh(file));return r.data.text||''},ghi)}finally{wk.terminate()}
}
async function docOCRMayChu(file,ghi=()=>{}){
  const gui=async cv=>{let b;if(cv){b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.88))}else b=await nenAnh(file);const r=await goiSV('ocr',{b64:await toB64(b),type:'image/jpeg'});return r.text||''};
  return docDaHuong(file,gui,ghi);
}

/* ================== TÌM KIẾM THÔNG MINH ================== */
function tachTu(s){return nds(s).replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean)}
function osa(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;const m=a.length,n=b.length;let p2=null,p=Array.from({length:n+1},(_,j)=>j);

/* ---- Đọc mọi định dạng file ---- */
async function docVanBan(file){
  const buf=new Uint8Array(await file.arrayBuffer());const n=file.name.toLowerCase();
  if(/\.(odt|odp|ods|pptx|ppsx|potx|xlsx|epub)$/.test(n)||(buf[0]===0x50&&buf[1]===0x4b)){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');const z=await JSZip.loadAsync(buf);const parts=[];
    const names=Object.keys(z.files).filter(k=>/(content\.xml|slides\/slide\d+\.xml|word\/document\.xml|\.x?html?)$/.test(k)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    for(const k of names){const x=await z.file(k).async('string');parts.push(x.replace(/<\/(text:p|a:p|w:p|p|tr|div|li|table:table-row)>/g,'\n').replace(/<(text:tab|w:tab|table:table-cell|td|th)[^>]*\/?>/g,'\t').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'"))}
    if(parts.join('').trim())return parts.join('\n');
  }
  let s='';try{s=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){s=''}
  if(s&&/^\s*\{\\rtf/.test(s))return s.replace(/\\u(-?\d+)\??/g,(m,c)=>String.fromCharCode(+c<0?+c+65536:+c)).replace(/\\par[d]?/g,'\n').replace(/\\tab/g,'\t').replace(/\\'([0-9a-f]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\[a-z]+-?\d* ?/g,'').replace(/[{}]/g,'');
  if(s&&(s.match(/[\x00-\x08\x0e-\x1f]/g)||[]).length<s.length*0.01)return s;
  const u=new TextDecoder('utf-16le').decode(buf.length%2?buf.slice(0,-1):buf);const runs=u.match(/[\p{L}\p{N}\p{P}\p{Zs}\t]{4,}/gu)||[];
  const v=runs.filter(r=>/\p{L}{2,}/u.test(r)&&!/[　-鿿가-힯]/.test(r)).join('\n');
  if(v.replace(/\s/g,'').length>20)return v;
  const a=(new TextDecoder('latin1').decode(buf).match(/[\x20-\x7eÀ-ɏ]{5,}/g)||[]).join('\n');
  if(a.replace(/\s/g,'').length>20)return a;
  throw new Error('Không tìm thấy chữ trong file này. Nếu là ảnh, video hay bản scan, hãy chụp hoặc xuất ra ảnh, PDF rồi chọn lại.');
}
async function docNguon(t,file,prog){
  const n=file.name.toLowerCase(),ext=(n.match(/\.([a-z0-9]+)$/)||[])[1]||'',ty=file.type||'';
  const needX=()=>{if(typeof XLSX==='undefined')throw new Error('Chưa tải được thư viện Excel, kiểm tra mạng')};
  if(/^(xlsx|xlsm|xlsb|xls|xltx|xltm|xlt|ods|fods|csv|tsv|numbers|dbf|slk|sylk|prn|dif|et|ett|wk[1-4]|qpw)$/.test(ext)||/spreadsheet|excel|csv/.test(ty)){needX();try{return await docExcel(t,file)}catch(e){if(/^(csv|tsv|prn)$/.test(ext))return docTextRows(t,await file.text());throw e}}
  if(/^(docx|docm|dotx|dotm)$/.test(ext)||/wordprocessingml/.test(ty))return docWord(t,file);
  if(ext==='pdf'||ty==='application/pdf')return S.cfg.aiKey?docAI(t,file,'pdf'):docPDFText(t,file);
  if(ty.startsWith('image/')||/^(jpe?g|png|gif|webp|bmp|tiff?|heic|heif|avif|jfif)$/.test(ext)){
    try{return S.cfg.aiKey?await docAI(t,file,'img'):await docOCR(t,file,prog)}catch(e){if(/heic|heif/.test(ext+ty))throw new Error('Máy này không mở được ảnh HEIC. Trên iPhone vào Cài đặt → Camera → Định dạng → Tương thích nhất, hoặc chụp lại bằng nút "Chụp ảnh" trong app.');throw e}}
  if(ty.startsWith('video/')||ty.startsWith('audio/'))throw new Error('File âm thanh, video không chứa bảng số liệu. Hãy chụp ảnh chứng từ hoặc chụp màn hình rồi chọn lại.');
  if(/^(html?|xml|mht|mhtml)$/.test(ext)){needX();try{return await docExcel(t,file)}catch(e){}}
  if(ext==='json'){try{const j=JSON.parse(await file.text());const arr=Array.isArray(j)?j:Object.values(j).find(Array.isArray)||[j];const keys=[...new Set(arr.flatMap(o=>Object.keys(o||{})))];const r=aoaToRows(t,[keys,...arr.map(o=>keys.map(k=>o[k]))]);if(r&&r.length)return{rows:r,note:''}}catch(e){}}
  const vb=await docVanBan(file);TXT_ALL=vb;TXT_GOI+=' '+vb.slice(0,1500);return docTextRows(t,vb);
}
async function docTextRows(t,text){
  if(S.cfg.aiKey&&text.trim().length>10){try{return await docAI(t,null,'txt',text)}catch(e){}}
  return textToRows(t,text);
}

/* ================== TỰ KHỚP VẬT TƯ GIỮA NHẬP, XUẤT ================== */
const vtGon=s=>nds(s).replace(/(\d)\s*(w|kw|a|v|mm|m)\b/g,'$1$2').replace(/[^a-z0-9]/g,'');
const vtTok=s=>nds(s).replace(/(\d)\s*(w|kw|a|v|mm|m)\b/g,'$1$2').split(/[^a-z0-9]+/).filter(Boolean);
function khopVT(ma,ten){
  const m=normMa(ma);
  if(m&&S.dmvt.some(d=>d.maVT===m))return m;
  if(m){const g=m.replace(/[-_./]/g,'');const h=S.dmvt.find(d=>d.maVT.replace(/[-_./]/g,'')===g);if(h)return h.maVT}
  if(ten&&String(ten).trim()){
    const k=vtGon(ten);if(k.length>=3){const h=S.dmvt.find(d=>d.tenVT&&vtGon(d.tenVT)===k);if(h)return h.maVT}
    const A=new Set(vtTok(ten)),soA=[...A].filter(t=>/\d/.test(t)).sort().join('|');let best=null,bs=0;
    if(A.size>=2)S.dmvt.forEach(d=>{if(!d.tenVT)return;const B=new Set(vtTok(d.tenVT));if([...B].filter(t=>/\d/.test(t)).sort().join('|')!==soA)return;
      const i=[...A].filter(t=>B.has(t)).length,j=i/(A.size+B.size-i);if(j>bs){bs=j;best=d}});
    if(best&&bs>0.8)return best.maVT;
  }
  if(m){const h=S.dmvt.find(d=>d.tenVT&&vtGon(d.tenVT)===m.replace(/[-_./]/g,'').toLowerCase());if(h)return h.maVT}
  return '';
}

after.trangchu=()=>{

  const viTri=el=>{const m=el.transform.baseVal.consolidate();const x=m?m.matrix.e:0,y=m?m.matrix.f:0;let best=0,bd=1e9;for(let s=0;s<lap;s+=lap/240){const p=vong.getPointAtLength(s);const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;best=s}}return best};
  const chay=(el,done)=>{
    const g=$('#hGoi');if(!g)return;if(itMotion()||el.classList.contains('trung')){el.classList.add('chon');setTimeout(done,itMotion()?0:450);return}
    el.classList.add('chon');const s0=viTri(el),dur=950,t0=performance.now();

      if(k<.7){const p=vong.getPointAtLength((s0+lap*.22*e/.7*.7)%lap);pk.setAttribute('transform',`translate(${p.x},${p.y})`)}
      else{const p=vong.getPointAtLength((s0+lap*.22*.7)%lap);const q=(k-.7)/.3;const x=p.x+(L.cx-p.x)*q,y=p.y+(L.cy-p.y)*q;pk.setAttribute('transform',`translate(${x},${y}) scale(${1-q*.6})`)}
      if(k<1)requestAnimationFrame(buoc);else{pk.remove();done()}};

  document.querySelectorAll('.home-svg .tram').forEach(el=>{const mo=()=>{if(el.classList.contains('chon'))return;chay(el,()=>{const v=TRAM[el.dataset.tram]?TRAM[el.dataset.tram].v:'tondong';go(v)})};

function goiTuChu(s){
  const n=' '+nds(s).replace(/[^a-z0-9]+/g,' ')+' ';if(!n.trim())return'';const F=new Set();
  for(const g of dsGoi()){const so=String(g.ma).replace(/\D/g,'');
    if(so&&new RegExp(`\\s(?:goi(?:\\s*thau)?(?:\\s*so)?|g)\\s*0*${so}\\s`).test(n))F.add(g.ma);
    const tn=' '+nds(g.ten).replace(/[^a-z0-9]+/g,' ').trim()+' ';if(tn.trim().length>=3&&n.includes(tn))F.add(g.ma);
    String(g.tu||'').split(/[,;\n]/).map(x=>nds(x).replace(/[^a-z0-9]+/g,' ').trim()).filter(x=>x.length>=3).forEach(k=>{if(n.includes(' '+k+' '))F.add(g.ma)})}
  return F.size===1?[...F][0]:'';
}
function normGoi(v){
  const s=String(v??'').trim();if(!s)return'';
  if(dsGoi().some(g=>g.ma===s))return s;
  const n=nds(s).replace(/thau|so|[^a-z0-9]/g,'');const m=n.match(/^(?:goi|g)?0*(\d+)$/);
  if(m){const g=dsGoi().find(x=>String(x.ma).replace(/\D/g,'')===m[1]);if(g)return g.ma}
  const g=dsGoi().find(x=>nds(x.ten).replace(/[^a-z0-9]/g,'')===nds(s).replace(/[^a-z0-9]/g,''));if(g)return g.ma;
  return goiTuChu(s);
}

const coTrongHD=(maVT,g)=>{const d=S.dmvt.find(x=>x.maVT===maVT);return !d||!d.goiHD||!Object.keys(d.goiHD).length||d.goiHD[g]!=null};

function goiTuDong(maVT,ctx={}){

  if(ctx.xuat){const b=goiTheoTon(maVT,ctx.kho||'Kho chính',ctx.ngay,ctx.exclId);if(b)return b}

function soLieuGoi(g){
  const M=new Map();const row=(ma)=>{let r=M.get(ma);if(!r){const d=S.dmvt.find(x=>x.maVT===ma)||{};r={maVT:ma,tenVT:d.tenVT||'',dvt:d.dvt||'',hd:d.goiHD&&d.goiHD[g]!=null?+d.goiHD[g]:null,gia:d.giaHD&&d.giaHD[g]||0,nhap:0,hoan:0,xuat:0,ton:0};M.set(ma,r)}return r};
  S.dmvt.forEach(d=>{if(d.goiHD&&d.goiHD[g]!=null)row(d.maVT)});
  S.pn.forEach(p=>{if(!tinhKho(p))return;p.lines.forEach(l=>{if((l.goi||'')!==g)return;const r=row(l.maVT);if(!r.tenVT)r.tenVT=l.tenVT||'';if(p.loai==='Hoàn nhập')r.hoan+=+l.sl||0;else if(p.loai!=='Điều chỉnh kiểm kê'&&p.loai!=='Thu hồi')r.nhap+=+l.sl||0;r.ton+=+l.sl||0})});
  S.px.forEach(p=>{if(!tinhKho(p))return;p.lines.forEach(l=>{if((l.goi||'')!==g)return;const r=row(l.maVT);if(!r.tenVT)r.tenVT=l.tenVT||'';if(p.loai!=='Điều chỉnh kiểm kê')r.xuat+=+l.sl||0;r.ton-=+l.sl||0})});
  return[...M.values()].map(r=>{r.conNhap=r.hd==null?null:r.hd-r.nhap;r.pt=r.hd?r.nhap/r.hd:null;return r}).sort((a,b)=>a.maVT.localeCompare(b.maVT));
}

/* ================== TÁCH SỐ LIỆU TỪ CHỮ ĐỌC ĐƯỢC TRONG ẢNH ================== */
const BO_DONG=/(phieu (nhap|xuat|linh|lanh|de nghi)|mau so|ban hanh|^so\s*[:.]|ngay\s*\d|thang\s*\d|nguoi (nhan|giao|lap|lanh)|ho (va )?ten|ly do|tai kho|dia chi|bo phan|don vi|^stt|ten,? ?nhan hieu|ten vat tu|quy cach|ma so|don vi tinh|so luong|don gia|thanh tien|yeu cau|thuc (xuat|nhap)|bang chu|tong (so|cong)|^cong\b|thu kho|ke toan|giam doc|ky,? ?ho ten|nguoi lap|chung tu goc)/;
const DON_VI_KT=new Set(['w','kw','a','v','va','kva','mm','mm2','m2','m3','hz','lm','k']);
function sauOCR(tk){return tk.length<=9&&/^[\dOoIlSB.,]+$/.test(tk)&&/\d/.test(tk)?tk.replace(/[Oo]/g,'0').replace(/[Il]/g,'1').replace(/S/g,'5').replace(/B/g,'8'):tk}
function soVN(t){t=String(t);if(/^\d{1,3}(\.\d{3})+,\d+$/.test(t))return+t.replace(/\./g,'').replace(',','.');if(/^\d{1,3}(,\d{3})+\.\d+$/.test(t))return+t.replace(/,/g,'');if(/^\d{1,3}(\.\d{3})+$/.test(t))return+t.replace(/\./g,'');if(/^\d{1,3}(,\d{3})+$/.test(t))return+t.replace(/,/g,'');return+t.replace(',','.')}
function tachDong(line){
  line=String(line||'').replace(/[|_\[\]{}“”"'`~*]/g,' ').replace(/\s+/g,' ').trim();if(line.length<3)return null;
  let tk=line.split(' ').map(sauOCR);
  for(let i=0;i<tk.length-1;i++)if(/^\d+([.,]\d+)?$/.test(tk[i])&&DON_VI_KT.has(norm(tk[i+1]))){tk[i]=tk[i]+tk[i+1];tk.splice(i+1,1)}
  if(/^\d{1,3}[.)]?$/.test(tk[0])&&tk.length>2)tk.shift();
  const laSo=t=>/^\d[\d.,]*$/.test(t),laDVT=t=>!!DVT_MAP[norm(t)],laMa=t=>/^[A-Za-z][A-Za-z0-9\-_.\/,]{2,}$/.test(t)&&/[-_.\/]/.test(t)&&(/\d/.test(t)||/^[A-Z0-9\-_.\/]+$/.test(t)&&(t.match(/-/g)||[]).length>=2);
  const so=[];let dvt='',ma='',i=tk.length-1;
  for(;i>=0;i--){const t=tk[i];if(laSo(t))so.unshift(t);else if(!dvt&&laDVT(t)&&i>0)dvt=t;else if(!ma&&laMa(t))ma=t;else break}
  const chu=tk.slice(0,i+1);if(!so.length||!chu.length)return null;
  const v=so.map(soVN).filter(x=>!isNaN(x));if(!v.length)return null;
  let sl=v[v.length-1],gia=0;const L=v.length;
  if(L>=3&&v[L-2]>0&&Math.abs(v[L-1]-v[L-2]*v[L-3])<=Math.max(1,v[L-1]*0.02)){sl=v[L-3];gia=v[L-2]}
  else if(L>=2&&v[L-1]>=1000&&v[L-2]>0&&v[L-2]<1000){sl=v[L-2];gia=v[L-1]}
  if(!ma){const mi=chu.findIndex(laMa);if(mi>=0){ma=chu[mi];chu.splice(mi,1)}}
  const ten=chu.join(' ').replace(/^[-–:.,;]+|[-–:.,;]+$/g,'').trim();
  if(ten.replace(/[^\p{L}]/gu,'').length<2||!(sl>0)||sl>1e6)return null;
  return{tenVT:ten,maVT:ma,dvt,sl,donGia:gia||undefined};
}
function tachThoPhieu(text){
  const out=[];let prev=null,cach=0;
  for(const raw of String(text||'').split(/\r?\n/)){const line=raw.replace(/[|_\[\]{}“”"`~*]/g,' ').replace(/\s+/g,' ').trim();if(!line){continue}
    const n=nds(line);if(BO_DONG.test(n)){prev=null;continue}
    const o=tachDong(line);if(o){out.push(o);prev=o;cach=0;continue}
    if(!prev||++cach>3||line.length>90)continue;
    // Dòng nối tiếp của ô nhiều dòng: phần tên vật tư, phần mã bị xuống dòng
    let tk=line.split(' ');const moNgoac=(prev.tenVT.match(/\(/g)||[]).length>(prev.tenVT.match(/\)/g)||[]).length;
    const iMa=tk.findIndex((t,i)=>i>=tk.length-2&&/^[0-9A-Z][0-9A-Za-z\-_.\/,]*$/.test(t)&&/\d/.test(t)&&/[-\/]/.test(t));
    if(iMa>=0&&prev.maVT&&/[-_.\/]$/.test(prev.maVT)){prev.maVT+=tk[iMa];tk.splice(iMa,1)}
    else if(iMa>=0&&!prev.maVT&&tk.length>1&&/\p{Lu}{2,}/u.test(tk[iMa])){prev.maVT=tk[iMa];tk.splice(iMa,1)}
    const them=tk.join(' ').trim();
    if(them&&(moNgoac||/^[\p{Ll}(Øø\d]/u.test(them)||them.length<=30&&!/^\p{Lu}[\p{Ll}]+ \p{Lu}[\p{Ll}]+ \p{Lu}/u.test(them)))prev.tenVT=(prev.tenVT+' '+them).replace(/\s+/g,' ').trim();
  }
  return out;
}

let TXT_ALL='';
async function anhSach(file){
  // Làm rõ ảnh chụp điện thoại: phóng to vừa đủ, xám, cân sáng theo vùng (khử bóng), tăng tương phản
  const bmp=await createImageBitmap(file);let w=bmp.width,h=bmp.height;const k=Math.min(2.2,Math.max(1,1900/Math.max(w,h)),2400/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,w,h);
  const im=x.getImageData(0,0,w,h),d=im.data,g=new Float32Array(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=.299*d[i]+.587*d[i+1]+.114*d[i+2];
  const I=new Float64Array((w+1)*(h+1));for(let y=1;y<=h;y++){let s=0;for(let xx=1;xx<=w;xx++){s+=g[(y-1)*w+xx-1];I[y*(w+1)+xx]=I[(y-1)*(w+1)+xx]+s}}
  const r=Math.max(12,Math.round(Math.min(w,h)/40));
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const x0=Math.max(0,xx-r),x1=Math.min(w,xx+r+1),y0=Math.max(0,y-r),y1=Math.min(h,y+r+1);
    const m=(I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0])/((x1-x0)*(y1-y0));const v=g[y*w+xx];
    const o=v<m*0.86?Math.max(0,255*(v/(m*0.86))-60):255;const p=(y*w+xx)*4;d[p]=d[p+1]=d[p+2]=o}
  x.putImageData(im,0,0);return c;
}

/* Lấy thông tin chung trên phiếu: ngày, số phiếu, người giao/nhận, kho */
function layDauPhieu(text){
  const o={};const L=String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  for(const line of L.slice(0,40)){const n=nds(line);
    if(!o.ngay){let m=n.match(/ngay\s*(\d{1,2})\s*thang\s*(\d{1,2})\s*nam\s*(\d{4})/);if(m)o.ngay=`${m[1]}/${m[2]}/${m[3]}`;else{m=line.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](20\d{2})\b/);if(m&&/ngay|date/.test(n))o.ngay=`${m[1]}/${m[2]}/${m[3]}`}}
    if(!o.soPhieu){const m=n.match(/(?:^|\s)so(?:\s*phieu)?\s*[:.]\s*([a-z0-9][a-z0-9\/\-.]{0,24})/);if(m&&/\d/.test(m[1]))o.soPhieu=m[1].toUpperCase()}
    if(!o.nguoi){const m=line.match(/(?:h[oọ]\s*(?:v[aà]\s*)?t[eê]n\s*)?ng[uư][oờ]i\s*(?:nh[aậ]n|giao|l[aã]nh)(?:\s*h[aà]ng)?\s*[:.]\s*(.+)$/i);if(m&&m[1].replace(/[.…\s]/g,'').length>1)o.nguoi=m[1].split(/\s{2,}|\s+(?:b[oộ]\s*ph[aậ]n|đ[iị]a\s*ch[iỉ]|đ[oơ]n\s*v[iị])\s*:/i)[0].replace(/[.…]{2,}.*/,'').trim()}
    if(!o.kho&&!o.khoGhi){const m=line.match(/(?:xu[aấ]t|nh[aậ]p)\s*t[aạ]i\s*kho\s*[:.]?\s*(.+)$/i);if(m&&m[1].replace(/[.…\s]/g,'').length>1){const ten=m[1].replace(/[.…]{2,}.*/,'').replace(/\s+(?:đ[iị]a\s*đi[eể]m|đ[iị]a\s*ch[iỉ]).*$/i,'').replace(/^kho\s*/i,'').trim();const kk=khoList().find(k=>nds(k).replace(/^kho\s*/,'')===nds(ten));if(kk)o.kho=kk;else o.khoGhi=ten}}
    if(!o.lyDo){const m=line.match(/l[ýy]\s*do(?:\s*(?:xu[aấ]t|nh[aậ]p)(?:\s*kho)?)?\s*[:.]\s*(.+)$/i);if(m&&m[1].replace(/[.…\s]/g,'').length>2)o.lyDo=m[1].replace(/[.…]{2,}.*/,'').trim()}}
  if(o.lyDo){const i=L.findIndex(x=>x.includes(o.lyDo));for(let j=i+1;j>0&&j<Math.min(L.length,i+3);j++){const n=nds(L[j]);if(/^(xuat|nhap)\s*tai|^(stt|so luong|ten)|dia diem|^ma/.test(n))break;o.lyDo+=' '+L[j]}}
  return o;
}

function buocCai(){

  if(t.zalo)return`<div class="msg r">Bạn đang mở trong Zalo hoặc Facebook, nơi không cài được app. Bấm dấu ⋯ góc trên phải → <b>Mở bằng trình duyệt</b>, rồi bấm lại nút "Cài app".</div>`;
  if(t.ios)return`<ol class="hl"><li>${t.chromeIOS?'Trên iPhone nên dùng <b>Safari</b>: sao chép link bên dưới, mở Safari, dán vào.':'Đang dùng Safari: tốt.'}</li><li>Bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên lên) ở thanh dưới màn hình.</li><li>Kéo xuống, bấm <b>Thêm vào MH chính</b> → <b>Thêm</b>.</li><li>Mở app từ biểu tượng Kho vật tư trên màn hình chính, đăng nhập lại một lần.</li></ol><p class="muted">iPhone không tự hiện hộp hỏi cài, luôn làm theo các bước trên.</p>`;
  if(t.android)return`<ol class="hl"><li>${t.samsung?'Samsung Internet: bấm biểu tượng ☰ góc dưới → <b>Thêm trang vào</b> → <b>Màn hình chờ</b>.':t.firefox?'Firefox: bấm ⋮ → <b>Cài đặt</b>.':t.edge?'Edge: bấm ⋯ ở thanh dưới → <b>Thêm vào điện thoại</b>.':'Chrome: bấm dấu <b>⋮</b> góc trên phải → <b>Cài đặt ứng dụng</b> (hoặc <b>Thêm vào màn hình chính</b> → <b>Cài đặt</b>).'}</li><li>Xác nhận Cài đặt, đợi vài giây.</li><li>Biểu tượng Kho vật tư xuất hiện trên màn hình chính và trong danh sách ứng dụng.</li></ol>`;
  return`<ol class="hl"><li><b>Máy tính:</b> bấm biểu tượng cài đặt (màn hình có mũi tên) ở cuối thanh địa chỉ, hoặc ⋯ → Ứng dụng → <b>Cài đặt trang web này dưới dạng ứng dụng</b> (Edge) / ⋮ → Truyền, lưu và chia sẻ → <b>Cài đặt trang</b> (Chrome).</li><li><b>Điện thoại:</b> quét mã QR bên dưới bằng camera điện thoại, mở link bằng Chrome (Android) hoặc Safari (iPhone), rồi bấm nút "Cài app lên điện thoại" trong app.</li></ol>`;
}
async function caiApp(){
  const t=thietBi(),url=APP_URL();
  $('#dlgForm').innerHTML=`<h2 style="margin:0 0 6px">Cài app lên điện thoại, máy tính</h2>
  ${daCai()?'<div class="msg g">App đã được cài và đang chạy dạng ứng dụng trên thiết bị này.</div>':''}
  ${hoiCai&&!daCai()?`<div class="card" style="margin:8px 0"><p style="margin-top:0">Thiết bị này cài được ngay bằng một chạm.</p><button class="b p" type="button" id="caiNgay" style="font-size:16px;padding:10px 20px">Cài ngay</button></div>`:''}
  ${daCai()?'':`<h3 style="font-size:15px;margin:12px 0 4px">Cách cài trên thiết bị đang dùng</h3>${buocCai()}`}
  <h3 style="font-size:15px;margin:14px 0 4px">Mở app trên điện thoại khác</h3>
  <div class="qrwrap"><div id="qrBox" aria-label="Mã QR mở app"></div><div><p class="muted" style="margin:0 0 6px">Quét mã bằng camera điện thoại, hoặc gửi link qua Zalo. Sau khi mở link bằng trình duyệt, bấm "Cài app lên điện thoại".</p><input readonly value="${esc(url)}" id="caiUrl" style="width:100%"><div class="bar" style="margin:8px 0 0"><button class="b" type="button" id="caiCopy">Sao chép link</button>${navigator.share?'<button class="b" type="button" id="caiShare">Gửi link</button>':''}</div></div></div>
  <details id="caiKT"${daCai()?'':' open'}><summary><b>Kiểm tra điều kiện cài</b></summary><div id="caiKQ" class="muted">Đang kiểm tra…</div></details>
  <p class="muted" style="margin:10px 0 0">Phiên bản app: ${APP_VER}</p>
  <div class="bar" style="justify-content:flex-end;margin:14px 0 0"><button class="b" value="cancel">Đóng</button></div>`;
  moDialog();
  const cn=$('#caiNgay');if(cn)cn.onclick=async()=>{const e=hoiCai;hoiCai=null;e.prompt();try{const c=await e.userChoice;if(c.outcome==='accepted')$('#dlg').close()}catch(x){}};
  $('#caiCopy').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('Đã sao chép link app','','g')}catch(e){$('#caiUrl').select()}};
  const sh=$('#caiShare');if(sh)sh.onclick=()=>navigator.share({title:'Kho vật tư – CSKVTT',text:'Mở link bằng Chrome (Android) hoặc Safari (iPhone) rồi bấm "Cài app lên điện thoại":',url}).catch(()=>{});
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').then(()=>{const b=$('#qrBox');if(b&&window.QRCode){b.innerHTML='';new QRCode(b,{text:url,width:168,height:168,colorDark:'#0E3B37',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}}).catch(()=>{const b=$('#qrBox');if(b)b.textContent='Không tải được mã QR, dùng link bên cạnh.'});
  const kq=await kiemTraCai();const el=$('#caiKQ');if(!el)return;
  const loi=kq.filter(x=>!x[1]);
  el.innerHTML=`<ul class="kt">${kq.map(([n,ok,fix])=>`<li class="${ok?'ok':'no'}">${ok?'✓':'✗'} ${esc(n)}${ok?'':`<br><span>${esc(fix)}</span>`}</li>`).join('')}</ul>${loi.length?'<div class="msg r">Chưa đủ điều kiện cài. Sửa các mục đánh dấu ✗ rồi tải lại trang.</div>':daCai()?'':'<div class="msg g">Đã đủ điều kiện cài. Làm theo các bước ở trên.</div>'}`;
}
function capNhatNutCai(){const an=daCai();document.querySelectorAll('.nut-cai').forEach(b=>b.hidden=an)}
function moMenu(o){document.body.classList.toggle('menu-mo',!!o)}
const TAB_NHOM={goithau:'trangchu',trangchu:'trangchu',tondong:'trangchu',tralai:'trangchu',nhapkho:'nhapkho',xuatkho:'xuatkho',nhaphoan:'nhaphoan'};
function capNhatDT(v){
  const b=document.querySelector(`#nav button[data-v="${v}"]`);const t=$('#mTitle');
  if(t)t.innerHTML=v==='trangchu'?`${document.querySelector('.brand .logo').outerHTML}Kho vật tư`:esc((b&&b.firstChild&&b.firstChild.textContent.trim())||'Kho vật tư');
  document.querySelectorAll('#tabs [data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===TAB_NHOM[v]));capNhatNhomBadge();
  const n=$('#bdNH');const tb=$('#tbd');if(tb&&n){tb.hidden=n.hidden;tb.textContent=n.textContent}
}
function moNhanh(){
  const R=ROLE();if(R==='theodoi')return;
  const L=[['nk','Nhập Kho từ ảnh, file','Chụp phiếu hoặc chọn bất kỳ file nào'],['xk','Xuất Kho: phiếu lãnh, đề nghị','Chụp phiếu lãnh hoặc chọn file'],['hoan','Nhập Hoàn','Quyết toán phiếu lãnh, hoàn phần còn lại'],['tim','Tìm phiếu, thiết bị','Gõ hoặc nói'],...(R==='admin'?[['kk','Kiểm kê tồn kho','Đếm thực tế, app tự tính chênh lệch']]:[])];
  $('#dlgForm').innerHTML=`<h2 style="margin:0 0 10px">Thêm nhanh</h2><div class="nhanh">${L.map(([k,t,m])=>`<button type="button" class="b" data-nh="${k}"><b>${t}</b><span>${m}</span></button>`).join('')}</div><div class="bar" style="justify-content:flex-end;margin:14px 0 0"><button class="b" value="cancel">Đóng</button></div>`;
  const dlg=moDialog();
  document.querySelectorAll('[data-nh]').forEach(b=>b.onclick=()=>{const k=b.dataset.nh;dlg.close();setTimeout(()=>lamNhanh(k),60)});
}
function chonSCKQ(ma){
  if(ma){const x=S.suco.find(s=>s.ma===normMa(ma));if(x)return ketQuaSC(x)}
  const L=S.suco.filter(x=>!isClosed(x)).sort((a,b)=>Date.parse(b.tn)-Date.parse(a.tn));
  $('#dlgForm').innerHTML=`<h2 style="margin:0 0 6px">Ghi kết quả sửa chữa</h2><p class="muted" style="margin:0 0 8px">Chọn sự cố đã sửa (${L.length} sự cố chưa đóng).</p><input id="kqTim" placeholder="Tìm mã, tủ, trụ, hiện tượng…" style="width:100%"><div class="nhanh" id="kqDS" style="margin-top:10px"></div><div class="bar" style="justify-content:flex-end;margin:14px 0 0"><button class="b" value="cancel">Đóng</button></div>`;
  const dlg=moDialog();const ve=q=>{const n=norm(q);$('#kqDS').innerHTML=L.filter(x=>!n||norm([x.ma,x.tu,x.tru,x.diaChi,x.hienTuong].join(' ')).includes(n)).slice(0,80).map(x=>`<button type="button" class="b" data-kqm="${esc(x.ma)}"><b>${esc(x.ma)} · ${esc(x.tu||'')}${x.tru?' · trụ '+esc(x.tru):''}</b><span>${esc(x.hienTuong||'')} – ${esc(x.trangThai)}</span></button>`).join('')||'<p class="muted">Không có sự cố phù hợp.</p>';
    document.querySelectorAll('[data-kqm]').forEach(b=>b.onclick=()=>{const x=S.suco.find(s=>s.ma===b.dataset.kqm);dlg.close();setTimeout(()=>ketQuaSC(x),80)})};
  ve('');$('#kqTim').oninput=e=>ve(e.target.value);
}
function lamNhanh(k,ma){
  if(k==='nk'){go('nhapkho');nhapNhanh('pn');return}
  if(k==='xk'){go('xuatkho');nhapNhanh('px');return}
  if(k==='hoan'){go('nhaphoan');return}
  if(k==='tim'){const i=$('#timQ');i.focus();if(ma){i.value=ma;veTim(ma)}return}
  if(k==='noi'){noiTim();return}
  if(k==='kk'){go('tondong');openCapture('kk');return}
  if(k==='ps'){go('phieusua');return}
  if(k==='kqps'){go('phieusua');nhapKQPS();return}
  if(k==='kq'){go('suco');chonSCKQ(ma);return}
  if(k==='sc'){go('suco');editSC()}
  else if(k==='nh'){go('nh');editPhieu('pn',null,{hoan:true})}
  else{if(k==='kln')KHV.tab='kln';go(k==='kln'?'kehoach':k==='kk'?'tonkho':k==='cp'?'capphat':k);openCapture(k)}
}
function themVaoNhapDL(files){[...files].forEach(f=>{if(DOC_EXT.test(f.name))pending.push({file:f,loai:detectType(f.name)});else{const g=goiYGan(f.name);inbox.push({file:f,url:f.type.startsWith('image/')?URL.createObjectURL(f):'',refType:g?g.t:'',code:g?g.code:'',ghiChu:''})}});go('import')}
async function nhanChiaSe(){
  if(!('caches' in window))return;const c=await caches.open('qt-share');const ks=await c.keys();if(!ks.length)return;
  const files=[];for(const k of ks){const r=await c.match(k);if(r){const b=await r.blob();files.push(new File([b],decodeURIComponent(r.headers.get('x-name')||'file'),{type:b.type}))}await c.delete(k)}
  if(!files.length)return;
  if(ROLE()==='theodoi'){toast('Tài khoản theo dõi không nhập được file','');return}
  const A=ROLE()==='admin';
  const L=[['pn','Đọc thành phiếu Nhập Kho'],['px','Đọc thành phiếu lãnh (Xuất Kho)'],['nh','Đọc thành Nhập Hoàn'],...(A?[['kk','Đọc thành kiểm kê']]:[]),['att','Đính kèm vào sự cố, phiếu, hoặc nạp file Excel theo tên']];
  $('#dlgForm').innerHTML=`<h2 style="margin:0 0 4px">Đã nhận ${files.length} ảnh, file</h2><p class="muted" style="margin:0 0 10px">${esc(files.slice(0,4).map(x=>x.name).join(', '))}${files.length>4?'…':''}</p><div class="nhanh">${L.map(([k,t])=>`<button type="button" class="b" data-sh="${k}"><b>${t}</b></button>`).join('')}</div><div class="bar" style="justify-content:flex-end;margin:14px 0 0"><button class="b" value="cancel">Bỏ qua</button></div>`;
  const dlg=moDialog();
  document.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{const k=b.dataset.sh;dlg.close();setTimeout(()=>{if(k==='att')themVaoNhapDL(files);else if(k==='pn'||k==='px'){go(k==='pn'?'nhapkho':'xuatkho');nhapNhanh(k,files)}else{go(k==='pn'?'nhapkho':k==='px'?'xuatkho':k==='nh'?'nhaphoan':'tondong');openCapture(k);capThem(files)}},60)});
}
function chayThamSo(){
  const p=thamSoCho;thamSoCho=null;if(!p)return;
  if(p.v&&V[p.v])go(p.v);
  if(p.share)setTimeout(nhanChiaSe,300);
  else if(p.lam&&ROLE()!=='theodoi')setTimeout(()=>lamNhanh(p.lam==='suco'?'sc':p.lam,p.ma),300);
}
async function dangKySW(){
  if(!('serviceWorker' in navigator)||!/^https:$/.test(location.protocol))return;
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.go&&V[e.data.go])go(e.data.go)});
  try{
    swReg=await navigator.serviceWorker.register('qt-sw.js',{scope:'quytrinh'});
    swReg.addEventListener('updatefound',()=>{const w=swReg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='activated'&&navigator.serviceWorker.controller)toast('Đã có phiên bản mới','Đóng hẳn app rồi mở lại, hoặc bấm "Kiểm tra bản mới" ở Cài đặt.','g')})});
    setInterval(()=>swReg.update().catch(()=>{}),3600e3);
  }catch(e){console.log('Không đăng ký được service worker',e)}
}
function luuFile(wb,name){
  if(chamTay()&&navigator.canShare){try{const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});const f=new File([buf],name,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(e=>{if(e.name==='AbortError')XLSX.writeFile(wb,name)});return}}catch(e){}}
  XLSX.writeFile(wb,name);
}
function theCaiDat(){
  const tt=daCai()?'<span class="pill pg">Đang chạy dạng ứng dụng</span>':'<span class="pill pa">Đang chạy trong trình duyệt</span>';
  const tb='Notification' in window?(Notification.permission==='granted'?'<span class="pill pg">Đã bật thông báo</span>':Notification.permission==='denied'?'<span class="pill pr">Thông báo bị chặn trong cài đặt trình duyệt</span>':'<button class="b" type="button" id="cdTB">Bật thông báo</button>'):'<span class="pill pn">Thiết bị không hỗ trợ thông báo</span>';
  return`<div class="card"><h2 style="margin-top:0">Cài lên điện thoại, máy tính</h2><p class="muted" style="margin-top:0">Cài app để có biểu tượng riêng, mở toàn màn hình, chạy khi mất mạng (dữ liệu tự gửi lên máy chủ khi có mạng lại), chụp ảnh bằng camera sau, nhận ảnh chia sẻ từ Zalo hoặc thư viện ảnh (Android), và giữ nút tắt: nhấn giữ biểu tượng app để ghi sự cố, chụp phiếu nhanh.</p>
  <div class="bar" style="margin:0">${tt}<button class="b p" type="button" id="cdCai">${daCai()?'Cài lên thiết bị khác (mã QR)':'Cài app'}</button>${tb}<button class="b" type="button" id="cdMoi">Kiểm tra bản mới</button></div>
  <p class="muted" style="margin:10px 0 0">Phiên bản app: ${APP_VER}. Nhắc 1022 chỉ hoạt động khi app đang mở (kể cả chạy nền trong thời gian ngắn); điện thoại không nhận nhắc khi app đã đóng hẳn.</p></div>`;
}
function ganCaiDat(){
  const a=$('#cdCai');if(a)a.onclick=caiApp;
  const t=$('#cdTB');if(t)t.onclick=async()=>{await Notification.requestPermission();render()};
  const m=$('#cdMoi');if(m)m.onclick=async()=>{try{if(swReg)await swReg.update()}catch(e){}location.reload()};
}
function ganDT(){
  $('#mMenu').onclick=()=>moMenu(true);$('#mBack').onclick=()=>moMenu(false);
  $('#mAdd').onclick=moNhanh;document.querySelectorAll('.nut-cai').forEach(b=>b.onclick=()=>{moMenu(false);caiApp()});capNhatNutCai();
  matchMedia('(display-mode: standalone)').addEventListener?.('change',capNhatNutCai);
  document.querySelectorAll('#tabs [data-t]').forEach(b=>b.onclick=()=>{const v=b.dataset.t;if(v==='add')moNhanh();else if(NHOM_MENU[v])vaoNhom(v);else go(v)});
  let x0=null;document.addEventListener('touchstart',e=>{x0=document.body.classList.contains('menu-mo')?e.touches[0].clientX:null},{passive:true});
  document.addEventListener('touchend',e=>{if(x0!=null&&x0-e.changedTouches[0].clientX>60)moMenu(false);x0=null},{passive:true});
}

/* ================== KHỞI ĐỘNG ================== */
document.querySelectorAll('#nav button[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
const clock=()=>{$('#clock').textContent=fmtDT(new Date())};
(async()=>{
  await loadAll();clock();ganDT();ganTim();dangKySW();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  anBanner=!!(await DB.get('anBannerCai'));PS.rows=(await DB.get('ps_rows'))||[];Object.assign(PSV.hdr,(await DB.get('ps_hdr'))||{});
  const qs=new URLSearchParams(location.search);const sv=qs.get('sv');
  thamSoCho={v:qs.get('v'),lam:qs.get('lam'),ma:qs.get('ma'),share:qs.has('share')};
  if(sv)await DB.set('srv_url',sv);if(location.search)history.replaceState(null,'',location.pathname)
  SRV.url=sv||(await DB.get('srv_url'))||SERVER_URL||'';
  if(!SRV.url){try{const r=await fetch('kho-maychu.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&/^https:\/\/script\.google(usercontent)?\.com\//.test(j.url||'')){SRV.url=j.url;await DB.set('srv_url',j.url)}}}catch(e){}}
  SRV.token=(await DB.get('srv_token'))||'';SRV.user=(await DB.get('srv_user'))||null;SRV.rev=(await DB.get('srv_rev'))||0;SRV.shadow=(await DB.get('srv_shadow'))||{};
  if(SRV.url&&SRV.token&&SRV.user){SRV.on=true;apDungVaiTro();go('dash');if(SRV.user.doiMK)doiMatKhau(true);else chayThamSo();dongBo()}
  else if(SRV.url){apDungVaiTro();manDangNhap('')}
  else{apDungVaiTro();go('dash');chayThamSo()}
  setInterval(clock,30000);
  setTimeout(tick1022,1500);setInterval(tick1022,60000);
  setInterval(()=>{if(SRV.on)dongBo()},30000);
  window.addEventListener('online',()=>SRV.on&&dongBo());
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SRV.on)dongBo()});
  setInterval(()=>{if(!$('#dlg').open&&!$('#viewer').open&&['dash','s1022'].includes(cur)&&!document.activeElement.matches('input,select'))render()},120000);
})();
</script>
