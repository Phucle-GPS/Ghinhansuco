<style>
:root{
  --bg:#EEF2F4;--paper:#FFFFFF;--side:#0E3B37;--side-ink:#C9D4DC;--ink:#14222E;--muted:#5A6873;--line:#D2DAE0;
  --amber:#B87400;--amber-soft:#FBEFD6;--red:#B42A25;--red-soft:#F8E1E0;--green:#2B7249;--green-soft:#DDEFE4;--head:#F3F6F8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1821;--paper:#15222D;--side:#082825;--side-ink:#9FB0BD;--ink:#E4EAEF;--muted:#9AA8B3;--line:#2A3A47;
  --amber:#F0B040;--amber-soft:#35290F;--red:#F07B75;--red-soft:#3A1918;--green:#6CC895;--green-soft:#15301F;--head:#1B2B38;}}
:root[data-theme="dark"]{
  --bg:#0E1821;--paper:#15222D;--side:#082825;--side-ink:#9FB0BD;--ink:#E4EAEF;--muted:#9AA8B3;--line:#2A3A47;
  --amber:#F0B040;--amber-soft:#35290F;--red:#F07B75;--red-soft:#3A1918;--green:#6CC895;--green-soft:#15301F;--head:#1B2B38;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,Arial,sans-serif}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
aside{background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
aside .brand{color:#fff;font-weight:700;font-size:17px;padding:4px 10px 16px;display:flex;align-items:center;gap:10px}
aside .brand i{width:12px;height:12px;border-radius:50%;background:#F0B040;box-shadow:0 0 0 5px rgba(240,176,64,.25)}
aside button{all:unset;cursor:pointer;padding:9px 10px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
aside button:hover{background:rgba(255,255,255,.06);color:#fff}
aside button.on{background:rgba(240,176,64,.16);color:#fff;box-shadow:inset 3px 0 0 #F0B040}
aside button:focus-visible{outline:2px solid #F0B040}
aside .bd{background:#B42A25;color:#fff;border-radius:10px;font-size:12px;padding:0 7px;font-weight:600}
aside .sp{flex:1}
aside small{padding:0 10px;opacity:.7}
@media (max-width:760px){aside{flex-direction:row;flex-wrap:wrap;padding:8px}aside .brand{width:100%;padding-bottom:6px}aside .sp,aside small{display:none}}
main{overflow:auto;padding:22px 26px 60px}
@media (max-width:760px){main{padding:16px 12px 60px}}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;max-width:80ch}
h2{font-size:16px;margin:22px 0 10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.kpi b{display:block;font-size:28px;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.kpi.r{border-left:4px solid var(--red)}.kpi.a{border-left:4px solid var(--amber)}.kpi.g{border-left:4px solid var(--green)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--paper);max-height:62vh}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
td.w{white-space:normal;min-width:180px}
th{background:var(--head);position:sticky;top:0;font-weight:600;z-index:1}
td.n,th.n{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--head)}
.pill{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;margin:1px 2px 1px 0}
.pg{background:var(--green-soft);color:var(--green)}.pa{background:var(--amber-soft);color:var(--amber)}.pr{background:var(--red-soft);color:var(--red)}.pn{background:var(--head);color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button.b,label.b{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:4px}
button.b:hover,label.b:hover{border-color:var(--amber)}
button.p{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:600}
:root[data-theme="dark"] button.p{color:#14222E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#14222E}}
button.d{color:var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.b:focus-within{outline:2px solid var(--amber);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.drop{border:2px dashed var(--line);border-radius:6px;padding:26px;text-align:center;color:var(--muted);background:var(--paper)}
.drop.over{border-color:var(--amber);background:var(--amber-soft)}
.msg{padding:10px 14px;border-radius:4px;margin:10px 0}
.msg.r{background:var(--red-soft)}.msg.a{background:var(--amber-soft)}.msg.g{background:var(--green-soft)}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:0;width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(10,18,26,.55)}
dialog form{padding:18px 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.grid .full{grid-column:1/-1}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(440px,92vw)}
.toast{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:13.5px}
.toast.g{border-left-color:var(--green)}
.toast header{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:4px}
.toast button{all:unset;cursor:pointer;color:var(--muted)}
.muted{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:980px){.two{grid-template-columns:1fr}}
aside .grp{font-size:12px;opacity:.55;padding:12px 10px 2px}
@media (max-width:760px){aside .grp{display:none}}
.att{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;margin-top:14px}
.att.over{border-color:var(--amber);background:var(--amber-soft)}
.att-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.thumb{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--head);display:flex;flex-direction:column}
.thumb .im{height:84px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--muted);text-align:center;padding:4px;word-break:break-all}
.thumb img{width:100%;height:84px;object-fit:cover;display:block}
.thumb input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:12px;padding:4px 6px;width:100%}
.thumb .x{all:unset;cursor:pointer;font-size:12px;color:var(--red);padding:2px 6px;text-align:right}
.thumb.new{outline:2px solid var(--amber)}
table.ed td{padding:4px 6px}
table.ed input{width:100%;min-width:70px;padding:4px 6px}
#viewer{width:min(1100px,96vw)}
dialog.wide{width:min(1320px,98vw)}
body.r-theodoi .qe,body:not(.r-admin) .qa,body.srv .qlocal,body:not(.srv) .qsrv{display:none!important}
#login{position:fixed;inset:0;background:var(--bg);z-index:60;display:grid;place-items:center;padding:20px;overflow:auto}
#login .lg{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:24px;width:min(400px,100%);display:grid;gap:12px}
#login label{display:grid;gap:4px;font-weight:600}#login input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}
.lgb{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}.lgb i{width:12px;height:12px;border-radius:50%;background:#F0B040;box-shadow:0 0 0 5px rgba(240,176,64,.25)}
#userBox{font-size:13px;padding:10px 10px 4px;border-top:1px solid rgba(255,255,255,.12);margin-top:8px}#userBox b{color:#fff}
#userBox .ub{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}#userBox .ub button{font:inherit;font-size:12px;background:transparent;color:var(--side-ink);border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:3px 8px;cursor:pointer}
#syncBox{display:block;padding:0 10px 6px;font-size:12px}
.hbar{float:right;display:flex;gap:8px;margin:0 0 8px 12px}
.att.ro [data-cam],.att.ro label.b,.att.ro .x,.att.ro-del .x[data-del]{display:none}
#mbar,#tabs,#mBack{display:none}
aside .navcai{margin:10px 0 0;border:1px solid rgba(240,176,64,.6);color:#F0B040;justify-content:center;font-weight:600}
aside .navcai.san{background:#F0B040;color:#14222E}
.qrwrap{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}#qrBox{background:#fff;padding:8px;border-radius:6px;min-width:168px;min-height:168px;color:#14222E;font-size:12px}#qrBox img,#qrBox canvas{display:block}
@media (max-width:520px){.qrwrap{grid-template-columns:1fr}#qrBox{justify-self:center}}
ul.kt{list-style:none;padding:0;margin:8px 0}ul.kt li{padding:4px 0}ul.kt li.ok{color:var(--green)}ul.kt li.no{color:var(--red)}ul.kt li span{color:var(--muted);font-size:13px}
#login #lgCai{justify-self:start}
.nhanh{display:grid;gap:8px}.nhanh .b{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:12px 14px;gap:2px}.nhanh .b span{color:var(--muted);font-size:13px}
@media (max-width:760px){
  :root{padding-top:0;padding-bottom:0}html,body{height:auto}
  .app{display:block;height:auto;min-height:100vh}
  main{overflow:visible;padding:12px 12px calc(90px + env(safe-area-inset-bottom,0px))}
  #mbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:10px;background:var(--side);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
  #mbar button{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:6px;font-size:24px;line-height:1}#mbar svg{width:24px;height:24px}
  #mTitle{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mSync{width:10px;height:10px;border-radius:50%;background:transparent}#mSync.ok{background:#6CC895}#mSync.dang{background:#F0B040}#mSync.loi{background:#F07B75}
  aside{position:fixed!important;top:0;bottom:0;left:0;width:min(300px,86vw);z-index:50;transform:translateX(-105%);transition:transform .2s ease;flex-direction:column!important;flex-wrap:nowrap!important;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 14px)!important;overflow:auto}
  body.menu-mo aside{transform:none;box-shadow:4px 0 24px rgba(0,0,0,.35)}
  body.menu-mo #mBack{display:block;position:fixed;inset:0;background:rgba(10,18,26,.5);z-index:45}
  aside .grp{display:block!important}aside .sp{display:block!important}aside small{display:block!important}aside button{padding:12px 10px}
  #tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  body.r-theodoi #tabs{grid-template-columns:repeat(4,1fr)}
  #tabs button{all:unset;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:7px 0 6px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
  #tabs button.on{color:var(--amber);font-weight:600}#tabs svg{width:22px;height:22px}
  #tabs .c{width:44px;height:44px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;margin-top:-20px;font-size:26px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  #tabs em{position:absolute;top:3px;left:calc(50% + 6px);background:#B42A25;color:#fff;border-radius:9px;font-size:10px;font-style:normal;padding:0 5px}
  input,select,textarea{font-size:16px!important}
  .b{min-height:40px}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0}
  dialog.wide{width:100vw}
  dialog form{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 24px)}
  h1{font-size:19px}.hbar{float:none;justify-content:flex-end}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:22px}
  .toasts{bottom:calc(80px + env(safe-area-inset-bottom,0px))!important;right:8px;left:8px;max-width:none}
  .tw{-webkit-overflow-scrolling:touch}
  #login{padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
}
@media (display-mode: standalone){body{-webkit-user-select:none;user-select:none}input,textarea,td,p,.msg{-webkit-user-select:text;user-select:text}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.chips label.b{display:inline-flex;gap:6px;align-items:center}
.psl{display:grid;gap:8px}.psr{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--paper)}.psr.vang{border-color:var(--amber);background:var(--amber-soft)}
.psh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.psh .x{margin-left:auto;min-height:0;padding:2px 9px}.psn{margin:4px 0 6px}.psf{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;margin-bottom:4px}.psf label{display:inline-flex;gap:4px;align-items:center}.psf input{width:120px}
#printArea{display:none}
@media print{
  body.dang-in>*:not(#printArea){display:none!important}body.dang-in #printArea{display:block}body.dang-in{background:#fff!important}
  @page{size:A4 landscape;margin:9mm 8mm}
  #printArea .pg{font-family:"Times New Roman",Times,serif;color:#000;font-size:10.5pt;break-after:page}#printArea .pg:last-child{break-after:auto}
  #printArea .pgh{display:flex;align-items:flex-start;gap:8mm}#printArea .dv{text-align:center;width:78mm}#printArea .u{font-weight:bold;text-decoration:underline}
  #printArea h1{flex:1;text-align:center;font-size:17pt;margin:9mm 30mm 0 0;color:#000}
  #printArea .pgl{display:flex;justify-content:space-between;margin:4mm 0 3mm}
  #printArea table{width:100%;border-collapse:collapse;table-layout:fixed}#printArea th,#printArea td{border:.6pt solid #000;padding:.8mm 1.2mm;vertical-align:middle;word-wrap:break-word;color:#000;background:#fff}
  #printArea th{font-weight:normal;text-align:center;font-size:9pt;word-break:keep-all;overflow-wrap:normal;hyphens:none}#printArea td{font-size:10pt}#printArea td{height:8.5mm}#printArea td.c{text-align:center}#printArea thead{display:table-header-group}#printArea tr{break-inside:avoid}
  #printArea .ky{display:flex;justify-content:space-around;margin-top:6mm;text-align:center;break-inside:avoid}
}
aside .ng{display:flex;flex-direction:column}
aside .nh{font-weight:600;color:#fff}aside .nh span:first-child{flex:1}
aside .mui{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;opacity:.7;margin-right:4px}
aside .ng.mo .mui{transform:rotate(45deg)}
aside .nsub{display:none;flex-direction:column;gap:2px;margin:0 0 6px 10px;padding-left:8px;border-left:1px solid rgba(255,255,255,.14)}aside .ng.mo .nsub{display:flex}
aside .ng.mo>.nh [data-gbd]{display:none}
aside .nh.co{color:#F0B040}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding:2px 0 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.subtabs button{flex:0 0 auto;font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:18px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.subtabs button.on{background:var(--amber);border-color:var(--amber);color:#14222E;font-weight:600}

.kqh{display:flex;gap:8px;font-size:12px;color:var(--muted);margin:0 0 4px}.kqh span:first-child{flex:1}.kqh span:nth-child(2),.kqh span:nth-child(3){width:62px}.kqh span:last-child{width:40px}
tr.kqtru td{background:var(--amber-soft)}
.logo{width:34px;height:34px;flex:0 0 auto}
.brand .bt,.lgb .bt{display:flex;flex-direction:column;line-height:1.15}.brand .bt small,.lgb .bt small{font-size:11px;font-weight:500;opacity:.7}
#mTitle{display:flex;align-items:center;gap:8px}#mbar .logo{width:26px;height:26px}
#timBar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;margin:0 0 4px}
.timw{display:flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:4px 6px 4px 14px;max-width:760px}

function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes());}
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})(?:[ T,]+(\d{1,2})[:h](\d{2}))?/);
  if(m)return new Date(+m[3],m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
  m=s.match(/^(\d{1,2})[:h](\d{2})[ ,]+(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(m)return new Date(+m[5],m[4]-1,+m[3],+m[1],+m[2]);
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m)return new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);if(m)return new Date(new Date().getFullYear(),m[2]-1,+m[1]);
  return null;
}

const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('cskvtt_quytrinh',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  _get(st,k){return new Promise(res=>{if(!this.db)return res(undefined);const q=this.db.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})},
  _put(st,k,v){return new Promise((res,rej)=>{if(!this.db)return res();const tx=this.db.transaction(st,'readwrite');tx.objectStore(st).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
  _del(st,k){return new Promise(res=>{if(!this.db)return res();const tx=this.db.transaction(st,'readwrite');tx.objectStore(st).delete(k);tx.oncomplete=res;tx.onerror=res})},
  get(k){return this._get('kv',k)},set(k,v){return this._put('kv',k,v)},
  getBlob(k){return this._get('blobs',k)},putBlob(k,v){return this._put('blobs',k,v)},delBlob(k){return this._del('blobs',k)},
  clearBlobs(){return new Promise(res=>{if(!this.db)return res();const tx=this.db.transaction('blobs','readwrite');tx.objectStore('blobs').clear();tx.oncomplete=res;tx.onerror=res})}
};

    return fileDate?`${fileDate.getFullYear()}-${pad(fileDate.getMonth()+1)}`:''}

async function nenAnh(f){

  try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));return b&&b.size<f.size?b:f}catch(e){return f}
}

function soSanh(d){
  const y=d.getFullYear(),m=d.getMonth(),q0=Math.floor(m/3)*3;
  const mS=new Date(y,m,1),qS=new Date(y,q0,1),qE=new Date(y,q0+3,0),end=endOfDay(d);
  const kyT=`${y}-${pad(m+1)}`,kyQ=`${y}-Q${q0/3+1}`,kyTQ=[0,1,2].map(i=>`${y}-${pad(q0+i+1)}`);
  const dim=new Date(y,m+1,0).getDate(),ptT=d.getDate()/dim,ptQ=(dayDiff(qS,d)+1)/(dayDiff(qS,qE)+1),conNgay=Math.max(1,dim-d.getDate()+1);
  let ptG=null,gS=null;
  if(S.cfg.goiBatDau&&S.cfg.goiKetThuc){gS=parseDate(S.cfg.goiBatDau);const gE=parseDate(S.cfg.goiKetThuc);ptG=Math.min(1,Math.max(0,(dayDiff(gS,d)+1)/(dayDiff(gS,gE)+1)))}
  const M=new Map();const get=(k,src)=>{let r=M.get(k);if(!r){r={maCV:k,tenCV:'',dvt:'',donGia:0,nhom:'',lkT:0,lkQ:0,lkG:0,khT:0,khQd:0,khQm:0,hasQ:false,klG:0,trongGoi:false,dvtKhac:new Set()};M.set(k,r)}if(src){r.tenCV||=src.tenCV||'';r.dvt||=src.dvt||'';if(!r.donGia&&src.donGia)r.donGia=src.donGia;if(!r.nhom&&src.nhom)r.nhom=src.nhom}return r};
  S.goi.forEach(g=>{if(!g.maCV)return;const r=get(g.maCV,g);r.klG+=g.kl||0;r.trongGoi=true;if(g.donGia)r.donGia=g.donGia;if(g.nhom)r.nhom=g.nhom;if(g.dvt)r.dvt=g.dvt;if(g.tenCV)r.tenCV=g.tenCV});
  S.kh.forEach(k=>{if(!k.maCV)return;if(k.loai==='T'&&k.ky===kyT)get(k.maCV,k).khT+=k.kl||0;if(k.loai==='Q'&&k.ky===kyQ){const r=get(k.maCV,k);r.khQd+=k.kl||0;r.hasQ=true}if(k.loai==='T'&&kyTQ.includes(k.ky))get(k.maCV,k).khQm+=k.kl||0});
  S.kln.forEach(r=>{if(r.xacNhan===false||!r.maCV)return;const t=Date.parse(r.ngay);if(isNaN(t)||t>end)return;if(gS&&t<gS)return;const x=get(r.maCV,r);if(r.dvt&&x.dvt&&normDVT(r.dvt)!==normDVT(x.dvt))x.dvtKhac.add(r.dvt);x.lkG+=r.kl||0;if(t>=qS)x.lkQ+=r.kl||0;if(t>=mS)x.lkT+=r.kl||0});
  const rows=[];const tot={};const T=n=>tot[n]||(tot[n]={lkT:0,khT:0,lkQ:0,khQ:0,lkG:0,klG:0,conG:0,conT:0,conQ:0});
  for(const r of M.values()){
    r.khQ=r.hasQ?r.khQd:r.khQm;
    if(!(r.lkT||r.lkQ||r.lkG||r.khT||r.khQ||r.klG))continue;
    r.pT=r.khT?r.lkT/r.khT:null;r.pQ=r.khQ?r.lkQ/r.khQ:null;r.pG=r.klG?r.lkG/r.klG:null;
    r.spi=r.pT!=null&&ptT?r.pT/ptT:null;
    r.conT=Math.max(0,r.khT-r.lkT);r.conQ=Math.max(0,r.khQ-r.lkQ);r.conG=r.klG?Math.max(0,r.klG-r.lkG):0;r.canNgay=r.conT/conNgay;
    r.co=[];
    if(r.lkT>0&&!r.khT)r.co.push(['Phát sinh ngoài KH tháng','pr']);
    if(S.goi.length&&!r.trongGoi&&r.lkG>0)r.co.push(['Không có trong gói','pr']);
    if(r.klG&&r.lkG>r.klG)r.co.push(['Vượt gói','pr']);
    else if(r.klG&&ptG!=null&&r.pG>ptG+0.1)r.co.push(['Dùng gói nhanh hơn tiến độ','pa']);
    if(r.spi!=null)r.co.push(r.spi>=0.95?['Đúng tiến độ','pg']:r.spi>=0.8?['Chậm','pa']:['Chậm nhiều','pr']);
    if(r.dvtKhac.size)r.co.push([`ĐVT không khớp gói (${[...r.dvtKhac].join(', ')})`,'pa']);
    const g=r.donGia||0;for(const t of [T(r.nhom||'CHUA'),T('ALL')]){t.lkT+=r.lkT*g;t.khT+=r.khT*g;t.lkQ+=r.lkQ*g;t.khQ+=r.khQ*g;t.lkG+=r.lkG*g;t.klG+=r.klG*g;t.conG+=r.conG*g;t.conT+=r.conT*g;t.conQ+=r.conQ*g}
    rows.push(r)}
  rows.sort((a,b)=>a.maCV.localeCompare(b.maCV));
  return{rows,ptT,ptQ,ptG,kyT,kyQ,tot,conNgay};
}
function vatTuRows(){
  const M=new Map();const scMap=new Map(S.suco.map(x=>[x.ma,x]));
  const g=(sc,vt,l)=>{const k=sc+'|'+vt;let r=M.get(k);if(!r){r={maSC:sc,maVT:vt,tenVT:'',dvt:'',lanh:0,hoan:0,sd:0,th:0,nhapTH:0,phieu:new Set()};M.set(k,r)}if(l){r.tenVT||=l.tenVT||'';r.dvt||=l.dvt||''}return r};
  S.px.forEach(p=>{if(p.loai!=='Thi công')return;p.lines.forEach(l=>{const r=g(l.maSC||p.maSC,l.maVT,l);r.lanh+=l.sl;r.phieu.add(p.soPhieu)})});
  S.pn.forEach(p=>{if(p.loai!=='Hoàn nhập'&&p.loai!=='Thu hồi')return;p.lines.forEach(l=>{const sc=l.maSC||p.maSC;if(!sc)return;const r=g(sc,l.maVT,l);if(p.loai==='Hoàn nhập')r.hoan+=l.sl;else r.nhapTH+=l.sl})});
  S.kln.forEach(k=>{if(!k.maVT)return;const r=g(k.maSC||k.maCV,k.maVT);r.sd+=k.slSD||0;r.th+=k.slThuHoi||0});
  const th=S.cfg.thuHoi.split(',').map(s=>norm(s)).filter(Boolean);const now=Date.now();
  return[...M.values()].map(r=>{
    r.chenh=r.lanh-r.sd-r.hoan;r.flags=[];const sc=scMap.get(r.maSC);r.sc=sc;
    const dongNgay=sc&&isClosed(sc)&&sc.tgXong?(now-Date.parse(sc.tgXong))/864e5:null;
    if(r.lanh===0&&r.sd>0)r.flags.push(['Dùng nhưng không có phiếu xuất','pr']);
    else if(r.chenh>0&&dongNgay!=null&&dongNgay>3)r.flags.push([`Dư ${fmtN(r.chenh)} chưa hoàn nhập (đóng ${Math.floor(dongNgay)} ngày)`,'pr']);
    else if(r.chenh<0)r.flags.push([`Dùng vượt xuất ${fmtN(-r.chenh)}`,'pr']);
    if(th.some(p=>norm(r.maVT).startsWith(p))&&r.sd>r.th)r.flags.push([`Thiếu thu hồi ${fmtN(r.sd-r.th)}`,'pa']);
    if(r.th>r.nhapTH&&dongNgay!=null&&dongNgay>3)r.flags.push([`Thu hồi ${fmtN(r.th-r.nhapTH)} chưa nhập kho`,'pa']);
    return r}).filter(r=>r.lanh||r.sd||r.hoan||r.th).sort((a,b)=>b.flags.length-a.flags.length||a.maSC.localeCompare(b.maSC));
}

s1022(){
  const now=new Date();const from=ky1022==='hom'?startOfDay(now):ky1022==='7'?new Date(now-7*864e5):ky1022==='thang'?new Date(now.getFullYear(),now.getMonth(),1):new Date(0);
  const all=S.suco.filter(x=>x.nhom==='1022');const open=all.filter(x=>!isClosed(x)).sort((a,b)=>ageH(b)-ageH(a));
  const R=new Map();const g=q=>{if(!R.has(q))R.set(q,{q,tn:0,xl:0,chua:0,c24:0,c48:0,ly:{}});return R.get(q)};
  all.forEach(x=>{const r=g(x.quan||'(chưa rõ)');if(Date.parse(x.tn)>=from){r.tn++;if(isDone(x))r.xl++}
    if(!isDone(x)){r.chua++;const h=ageH(x);if(h>=48)r.c48++;else if(h>=24)r.c24++;const l=(x.trangThai||'').startsWith('Tạm dừng')?x.trangThai.replace('Tạm dừng: ',''):(x.lyDoTon||'');if(l)r.ly[l]=(r.ly[l]||0)+1}});
  const rows=[...R.values()].sort((a,b)=>a.q.localeCompare(b.q,'vi',{numeric:true}));const T=rows.reduce((t,r)=>{['tn','xl','chua','c24','c48'].forEach(k=>t[k]+=r[k]);return t},{tn:0,xl:0,chua:0,c24:0,c48:0});
  const perm='Notification' in window?Notification.permission:'unsupported';
  window._bc1022={rows,T};
  return`<h1>Sự cố 1022 (cấp bách)</h1><p class="sub">App tự nhắc lặp lại mọi phiếu 1022 chưa "Đã đóng" theo nhịp: trong hạn ${S.cfg.nhip.thuong} phút, tồn &gt;24h ${S.cfg.nhip.qua24} phút, tồn &gt;48h ${S.cfg.nhip.qua48} phút, đã xử lý chờ đóng ${S.cfg.nhip.choDong} phút. Nhắc chạy khi cửa sổ app đang mở (thu nhỏ vẫn được).</p>
  <div class="bar">${perm==='granted'?'<span class="pill pg">Thông báo Windows: đang bật</span>':perm==='denied'?'<span class="pill pr">Thông báo Windows bị chặn – mở lại quyền trong cài đặt trang của trình duyệt</span>':perm==='unsupported'?'<span class="pill pa">Trình duyệt không hỗ trợ thông báo – chỉ hiện trong app</span>':'<button class="b p" id="perm">Bật thông báo Windows</button>'}
    <button class="b" id="thuNhac">Kiểm tra nhắc ngay</button><button class="b" id="am">${S.cfg.amThanh?'Tắt âm thanh':'Bật âm thanh'}</button></div>
  <h2>Báo cáo theo quận</h2>
  <div class="bar"><select id="ky1022">${opts([['hom','Tiếp nhận hôm nay'],['7','7 ngày qua'],['thang','Tháng này'],['all','Toàn bộ']],ky1022)}</select><button class="b" id="xuatBC">Xuất báo cáo Excel</button></div>
  <div class="tw"><table><thead><tr><th>Quận</th><th class="n">Tiếp nhận trong kỳ</th><th class="n">Đã xử lý (trong số tiếp nhận)</th><th class="n">Chưa xử lý (toàn bộ)</th><th class="n">Tồn 24–48h</th><th class="n">Tồn &gt;48h</th><th>Lý do tồn</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.q)}</td><td class="n">${r.tn}</td><td class="n">${r.xl}</td><td class="n">${r.chua}</td><td class="n">${r.c24?`<span class="pill pa">${r.c24}</span>`:0}</td><td class="n">${r.c48?`<span class="pill pr">${r.c48}</span>`:0}</td><td class="w">${Object.entries(r.ly).map(([k,v])=>`${esc(k)} (${v})`).join(', ')}</td></tr>`).join('')}
  <tr><td><b>Tổng</b></td><td class="n"><b>${T.tn}</b></td><td class="n"><b>${T.xl}</b></td><td class="n"><b>${T.chua}</b></td><td class="n"><b>${T.c24}</b></td><td class="n"><b>${T.c48}</b></td><td></td></tr></tbody></table></div>
  <h2>Phiếu chưa kết thúc (${open.length})</h2>
  <div class="tw"><table><thead><tr><th>Phiếu 1022</th><th>Mã sự cố</th><th>Tiếp nhận</th><th>Địa chỉ</th><th>Người xử lý</th><th>Trạng thái</th><th>Mức</th><th class="n">Tuổi</th><th class="n">Đã nhắc</th><th>Lý do tồn</th><th></th></tr></thead><tbody>
  ${open.map(x=>{const lv=level(x);return`<tr class="click" data-ma="${esc(x.ma)}"><td>${esc(x.so1022)}</td><td>${esc(x.ma)}</td><td>${fmtDT(x.tn)}</td><td class="w">${esc(x.diaChi)}</td><td>${esc(x.nguoi||'–')}</td><td>${pillTT(x.trangThai)}</td><td><span class="pill ${LV[lv][1]}">${LV[lv][0]}</span></td><td class="n">${fmtN(ageH(x),1)}h</td><td class="n">${x.soLanNhac||0}</td><td class="w">${esc(x.lyDoTon)}</td><td>${clip(soAnh('suco',x.ma))}</td></tr>`}).join('')||'<tr><td colspan="11" class="muted">Không có phiếu 1022 nào đang mở.</td></tr>'}
  </tbody></table></div>`},

  ${R.map(r=>`<tr class="click" data-vt="${esc(r.maVT)}" data-goi="${esc(r.goi||'')}"><td>${chk(r.maVT,'vt')}</td><td>${esc(r.maVT)}</td><td class="w">${esc(r.tenVT)} ${pillGoi(r.goi)}</td><td>${esc(r.dvt)}</td><td class="n">${fmtN(r.dau)}</td><td class="n">${fmtN(r.nhap)}</td><td class="n">${fmtN(r.xTC)}</td><td class="n">${fmtN(r.xKhac)}</td><td class="n"><b>${fmtN(r.cuoi)}</b></td>${window._TREO?`<td class="n">${(v=>v?fmtN(v):'')(window._TREO[r.maVT+'|'+(r.goi||'')])}</td>`:''}<td class="n"><input class="mini" type="number" min="0" data-min="${esc(r.maVT)}" value="${r.tonMin||''}"></td><td>${r.flags.map(f=>`<span class="pill ${f[1]}">${f[0]}</span>`).join('')||'<span class="pill pg">Đủ</span>'}</td></tr>`).join('')||'<tr><td colspan="11" class="muted">Chưa có vật tư. Tạo phiếu nhập (kể cả phiếu "Tồn đầu kỳ") để bắt đầu.</td></tr>'}

capphat(){
  const f=parseDate(CP.from)||startOfDay(new Date()),t=parseDate(CP.to)||new Date();let days=[];for(let d=startOfDay(f);d<=t&&days.length<62;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))days.push(ymd(d));
  const L=[];S.px.forEach(p=>{if(CP.loai&&p.loai!==CP.loai)return;if(CP.kho&&p.kho!==CP.kho)return;const k=ymd(p.ngay);if(!days.includes(k))return;p.lines.forEach((l,li)=>L.push({ngay:k,p,l,li}))});

function vPhieu(kind,mode){
  const isN=kind==='pn',isH=mode==='nh',key=isH?'nh':kind,f=PF[key],q=norm(f.q);const from=parseDate(f.from),to=f.to?endOfDay(parseDate(f.to)):null;
  const LO=isH||mode==='tl'?[]:isN?LOAI_NHAP.filter(x=>x!=='Hoàn nhập'&&x!=='Thu hồi'):LOAI_XUAT;
  let L=S[kind].filter(p=>(!isN||(isH?p.loai==='Hoàn nhập':mode==='tl'?p.loai==='Thu hồi':p.loai!=='Hoàn nhập'&&p.loai!=='Thu hồi'))&&(!f.loai||p.loai===f.loai)&&(!GOI.loc||p.lines.some(l=>goiKhop(l)))&&(!from||Date.parse(p.ngay)>=from)&&(!to||Date.parse(p.ngay)<=to)&&(!q||norm([p.soPhieu,p.maSC,p.nguoi,p.ghiChu,p.pxGoc,...p.lines.map(l=>l.maVT+' '+l.tenVT+' '+(l.maSC||''))].join(' ')).includes(q)));
  L.sort((a,b)=>Date.parse(b.ngay)-Date.parse(a.ngay)||b.soPhieu.localeCompare(a.soPhieu));window._pl=L;
  const title=isH?'Nhập hoàn vật tư':isN?'Phiếu nhập vật tư':'Phiếu xuất vật tư';
  const sub=isH?'Vật tư xuất cho thi công còn thừa được trả lại kho. Chọn phiếu xuất gốc để app tự điền số còn có thể hoàn (xuất − đã sử dụng − đã hoàn). Số nhập hoàn được trừ trong đối chiếu vật tư thi công.':isN?'Nhập mua mới, tồn đầu kỳ, thu hồi thiết bị cũ (vào kho thu hồi), điều chuyển đến, điều chỉnh kiểm kê. Vật tư thi công trả về kho nhập ở mục Nhập hoàn.':'Xuất thi công (phiếu lãnh, bắt buộc gắn mã sự cố hoặc hạng mục), điều chuyển, trả nhà cung cấp, hủy, điều chỉnh kiểm kê. App cảnh báo khi xuất vượt tồn.';
  return`<h1>${title}</h1><p class="sub">${sub} Tạo phiếu bằng tay hoặc nhập từ ảnh chụp, ảnh có sẵn trên máy, file Excel, Word, PDF. Mỗi phiếu đính kèm tối đa ${MAX_ANH} ảnh, file. Chọn phiếu rồi bấm xóa khi nhập sai.</p>
  <div class="bar"><input id="pq" placeholder="Tìm số phiếu, mã, vật tư…" value="${esc(f.q)}" style="min-width:200px">
    ${LO.length?`<select id="pl">${opts(LO,f.loai,'Tất cả loại')}</select>`:''}
    <label>Từ <input type="date" id="pf" value="${f.from}"></label><label>Đến <input type="date" id="pt" value="${f.to}"></label>
    <button class="b p qe" id="addP">Tạo phiếu</button><button class="b p qe" id="capP">Nhập từ ảnh, file</button>${delBtn(key)}${duyetBtn(key)}<button class="b" id="xuatP">Xuất Excel</button></div>

  </div><datalist id="dsQuan">${quans().map(q=>`<option value="${esc(q)}">`).join('')}</datalist>
  ${x?`<div style="margin-top:12px"><b>Vật tư đã xuất cho sự cố</b> ${vtCap.length?`<div class="tw" style="margin-top:6px;max-height:160px"><table><thead><tr><th>Ngày</th><th>Số phiếu</th><th>Vật tư</th><th class="n">SL</th></tr></thead><tbody>${vtCap.map(({p,l})=>`<tr><td>${fmtD(p.ngay)}</td><td>${esc(p.soPhieu)}</td><td>${esc(l.tenVT||l.maVT)}</td><td class="n">${fmtN(l.sl)} ${esc(l.dvt)}</td></tr>`).join('')}</tbody></table></div>`:'<span class="muted">chưa có phiếu xuất.</span>'}</div>`:''}
  <div class="att" id="attBox"></div>

  <div class="bar" style="margin:16px 0 0;justify-content:space-between"><div class="bar" style="margin:0"><button class="b" type="button" id="goiY">Đề xuất phân loại</button>${x?'<button class="b qe" type="button" id="kqSC">Ghi kết quả sửa chữa</button><button class="b d" type="button" id="xoaSC">Xóa</button>':''}</div>

    const coAnh=ctl.add.length+S.files.filter(fl=>fl.refType==='suco'&&x&&fl.refId===x.ma&&!ctl.del.has(fl.id)).length;

    if(d.trangThai==='Đã đóng'&&!coAnh&&!(x&&x.anh)&&!confirm('Sự cố chưa có ảnh sau xử lý. Vẫn đóng?'))return;

    await save('suco');dlg.close();render();
    if(DONE.includes(o.trangThai)&&!DONE.includes(before)&&!S.kln.some(k=>k.maSC===o.ma))setTimeout(()=>ketQuaSC(o),120)};

/* ================== FORM PHIẾU NHẬP / XUẤT ================== */
function editPhieu(kind,id,opt={}){
  const isN=kind==='pn';const p=id?S[kind].find(x=>x.id===id):null;if(id&&!p)return;const hoan=isN&&!!(opt.hoan||(p&&p.loai==='Hoàn nhập'));
  const v=p?structuredClone(p):{id:uid(),soPhieu:genSoPhieu(kind,null,hoan?'NH':''),ngay:new Date().toISOString(),loai:hoan?'Hoàn nhập':isN?'Mua mới':'Thi công',kho:'Kho chính',maSC:'',nguoi:'',ghiChu:'',lines:[]};
  if(!v.lines.length)v.lines.push({maVT:'',tenVT:'',dvt:'',sl:'',donGia:'',maSC:''});
  refreshLists();const f=$('#dlgForm');
  f.innerHTML=`<h2 style="margin:0 0 4px">${hoan?(p?'Phiếu nhập hoàn '+esc(p.soPhieu):'Tạo phiếu nhập hoàn'):p?(isN?'Phiếu nhập ':'Phiếu xuất ')+esc(p.soPhieu):(isN?'Tạo phiếu nhập':'Tạo phiếu xuất')}</h2><p class="muted" style="margin:0 0 14px">${p&&p._file?'Phiếu từ file '+esc(p._file)+'. Nạp lại file này sẽ ghi đè phiếu.':'Mỗi dòng một vật tư. Gõ mã vật tư để chọn từ danh mục.'}</p>
  <div class="grid">
    <label>Số phiếu<input name="soPhieu" value="${esc(v.soPhieu)}" required></label>
    <label>Ngày<input type="date" name="ngay" value="${ymd(v.ngay)}" required></label>
    <label>Loại ${isN?'nhập':'xuất'}<select name="loai"${hoan?' disabled':''}>${opts(hoan?['Hoàn nhập']:isN?LOAI_NHAP.filter(x=>x!=='Hoàn nhập'):LOAI_XUAT,v.loai)}</select></label>${hoan?`<label>Phiếu xuất gốc<select name="pxGoc">${opts(S.px.filter(x=>x.loai==='Thi công').sort((a,b)=>Date.parse(b.ngay)-Date.parse(a.ngay)).map(x=>[x.soPhieu,`${x.soPhieu} – ${fmtD(x.ngay)} – ${x.maSC||''}`]),v.pxGoc||'','– không chọn –')}</select></label>`:''}
    <label>Kho<input name="kho" value="${esc(v.kho)}" list="dsKho" required></label>
    <label>Gói thầu (cả phiếu)<select name="goiP">${opts([['','Theo từng dòng, tự xác định'],...dsGoi().map(g=>[g.ma,g.ten])],(g=>g==='*'?'':g)(goiPhieu(v)))}</select></label>
    <label>Mã công trình, sự cố<input name="maSC" value="${esc(v.maSC)}" list="dsMaSC" placeholder="Mã công trình, sự cố (nếu có)"></label>
    <label>${isN?'Người giao / Nhà cung cấp':'Người nhận / Tổ'}<input name="nguoi" value="${esc(v.nguoi)}"></label>
    <label class="full">Ghi chú<input name="ghiChu" value="${esc(v.ghiChu)}"></label>
  </div>
  <h3 style="margin:16px 0 6px;font-size:15px">Vật tư</h3>
  <div class="tw" style="max-height:300px"><table class="ed"><thead><tr><th>Mã VT</th><th>Tên vật tư</th><th>ĐVT</th><th class="n">SL</th>${isN?'<th class="n">Đơn giá</th>':''}<th>Gói thầu</th><th>Mã SC riêng dòng</th><th></th></tr></thead><tbody id="lines"></tbody></table></div>
  <div class="bar" style="margin-top:8px"><button class="b" type="button" id="addL">Thêm dòng</button><span class="muted" id="sumL"></span></div>
  <div class="att" id="attBox"></div>
  <div id="dlgMsg"></div>
  <div class="bar" style="margin:16px 0 0;justify-content:space-between"><div class="bar" style="margin:0">${p?'<button class="b d" type="button" id="xoaP">Xóa phiếu</button>':''}</div>
  <div class="bar" style="margin:0"><button class="b" value="cancel" formnovalidate>Đóng</button><button class="b p" type="button" id="luuP">Lưu phiếu</button></div></div>`;
  const drawL=()=>{
    $('#lines').innerHTML=v.lines.map((l,i)=>`<tr><td><input data-l="${i}" data-k="maVT" value="${esc(l.maVT)}" list="dsVT"></td><td><input data-l="${i}" data-k="tenVT" value="${esc(l.tenVT)}" style="min-width:160px"></td><td><input data-l="${i}" data-k="dvt" value="${esc(l.dvt)}" style="min-width:50px;width:60px"></td><td><input data-l="${i}" data-k="sl" value="${l.sl}" inputmode="decimal" style="width:80px"></td>${isN?`<td><input data-l="${i}" data-k="donGia" value="${l.donGia||''}" inputmode="decimal" style="width:100px"></td>`:''}<td><select data-l="${i}" data-k="goi">${opts([['','Tự xác định'],...dsGoi().map(g=>[g.ma,g.ten])],l.goi||'')}</select></td><td><input data-l="${i}" data-k="maSC" value="${esc(l.maSC)}" list="dsMaSC" placeholder="theo phiếu"></td><td><button class="b d" type="button" data-dl="${i}">✕</button></td></tr>`).join('');
    const sum=()=>{const s=v.lines.reduce((a,l)=>a+(num(l.sl)||0),0),t=v.lines.reduce((a,l)=>a+(num(l.sl)||0)*(num(l.donGia)||0),0);$('#sumL').textContent=`${v.lines.length} dòng, tổng SL ${fmtN(s)}${isN&&t?`, thành tiền ${fmtN(t,0)} đ`:''}`};sum();
    $('#lines').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const l=v.lines[+inp.dataset.l];l[inp.dataset.k]=inp.value;
      if(inp.dataset.k==='maVT'){const d=S.dmvt.find(x=>x.maVT===inp.value.trim());if(d){const row=inp.closest('tr');if(!l.tenVT){l.tenVT=d.tenVT;row.querySelector('[data-k=tenVT]').value=d.tenVT}if(!l.dvt){l.dvt=d.dvt;row.querySelector('[data-k=dvt]').value=d.dvt}
        if(!isN){const tn=tonTai(d.maVT,f.kho.value,parseDate(f.ngay.value)||new Date(),v.id);$('#dlgMsg').innerHTML=`<div class="msg ${tn>0?'g':'r'}">Tồn ${esc(d.maVT)} tại ${esc(f.kho.value)}: ${fmtN(tn)} ${esc(d.dvt)}</div>`}}}sum()});
    $('#lines').querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{v.lines.splice(+b.dataset.dl,1);if(!v.lines.length)v.lines.push({maVT:'',tenVT:'',dvt:'',sl:'',donGia:'',maSC:''});drawL()});
    $('#lines').querySelectorAll('select[data-k=goi]').forEach(x=>x.onchange=()=>{v.lines[+x.dataset.l].goi=x.value});
  };drawL();
  f.goiP.onchange=()=>{v.lines.forEach(l=>l.goi=f.goiP.value);drawL()};
  $('#addL').onclick=()=>{v.lines.push({maVT:'',tenVT:'',dvt:'',sl:'',donGia:'',maSC:'',goi:f.goiP.value});drawL();$('#lines').lastElementChild.querySelector('input').focus()};
  f.loai.onchange=()=>{if(isN)f.kho.value=f.loai.value==='Thu hồi'?'Kho thu hồi':(f.kho.value==='Kho thu hồi'?'Kho chính':f.kho.value)};
  if(hoan)f.pxGoc.onchange=()=>{const g=S.px.find(x=>x.soPhieu===f.pxGoc.value);if(!g)return;f.maSC.value=g.maSC||'';f.kho.value=g.kho;if(!f.nguoi.value)f.nguoi.value=g.nguoi||'';
    v.lines=g.lines.map(l=>{const sc=l.maSC||g.maSC;const daHoan=S.pn.filter(q=>q.loai==='Hoàn nhập'&&q.id!==v.id&&q.pxGoc===g.soPhieu).reduce((s,q)=>s+q.lines.filter(x=>x.maVT===l.maVT).reduce((a,x)=>a+x.sl,0),0);const dung=S.kln.filter(k=>(k.maSC||k.maCV)===sc&&k.maVT===l.maVT).reduce((s,k)=>s+(k.slSD||0),0);const gy=Math.max(0,l.sl-daHoan-dung);return{maVT:l.maVT,tenVT:l.tenVT,dvt:l.dvt,sl:gy||'',donGia:'',maSC:l.maSC||'',goi:l.goi||''}});
    drawL();$('#dlgMsg').innerHTML='<div class="msg a">Đã điền số đề xuất = xuất − đã sử dụng (nhật ký thi công) − đã hoàn. Sửa theo số thực tế trả về kho; dòng để trống sẽ bị bỏ qua.</div>'};
  const dlg=moDialog();attCtl=attachUI($('#attBox'),kind,v.id);const ctl=attCtl;
  if(p)$('#xoaP').onclick=async()=>{if(!confirm(`Xóa phiếu ${p.soPhieu} và các ảnh, file đính kèm? Tồn kho sẽ tính lại.`))return;S[kind]=S[kind].filter(x=>x.id!==p.id);await xoaDinhKem(fl=>fl.refType===kind&&fl.refId===p.id);await save(kind);dlg.close();render()};
  apQuyenPhieu(kind,p);
  $('#luuP').onclick=async()=>{
    if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));const so=d.soPhieu.trim();
    if(S[kind].some(x=>x.soPhieu===so&&x.id!==v.id)){alert('Số phiếu '+so+' đã tồn tại.');return}
    const ngay=parseDate(d.ngay);if(!ngay){alert('Ngày không hợp lệ');return}
    const lines=[];for(const l of v.lines){if(!String(l.maVT).trim()&&!String(l.sl).trim())continue;const sl=num(l.sl);
      if(!String(l.maVT).trim()||!(sl>0)){alert('Mỗi dòng vật tư cần mã vật tư và số lượng lớn hơn 0.');return}
      lines.push({goi:l.goi||'',maVT:khopVT(l.maVT,l.tenVT)||normMa(l.maVT),tenVT:(l.tenVT||'').trim(),dvt:normDVT(l.dvt),sl,donGia:isN?(num(l.donGia)||0):0,maSC:(l.maSC||'').trim()})}
    if(!lines.length){alert('Phiếu chưa có vật tư.');return}
    const np={...v,soPhieu:so,ngay:new Date(ngay.getFullYear(),ngay.getMonth(),ngay.getDate(),12).toISOString(),loai:hoan?'Hoàn nhập':d.loai,kho:d.kho.trim(),maSC:normMa(d.maSC),nguoi:d.nguoi.trim(),ghiChu:d.ghiChu.trim(),lines};
    if(hoan){np.pxGoc=d.pxGoc||'';
      const g=S.px.find(x=>x.soPhieu===np.pxGoc);if(g){const vuot=lines.filter(l=>{const xu=g.lines.filter(a=>a.maVT===l.maVT).reduce((s,a)=>s+a.sl,0);const da=S.pn.filter(q=>q.loai==='Hoàn nhập'&&q.id!==np.id&&q.pxGoc===g.soPhieu).reduce((s,q)=>s+q.lines.filter(a=>a.maVT===l.maVT).reduce((t,a)=>t+a.sl,0),0);return l.sl>xu-da});
        if(vuot.length&&!confirm('Số hoàn vượt số đã xuất ở phiếu gốc: '+vuot.map(l=>l.maVT).join(', ')+'. Vẫn lưu?'))return}}
    if(!isN&&np.loai==='Thi công'){
      const dong=[...new Set(lines.map(l=>l.maSC||np.maSC))].map(m=>S.suco.find(s=>s.ma===m)).filter(s=>s&&isClosed(s)&&s.tgXong&&Date.parse(np.ngay)>endOfDay(s.tgXong).getTime());
      if(dong.length&&!confirm('Xuất cho sự cố đã đóng: '+dong.map(s=>s.ma).join(', ')+'. Vẫn lưu?'))return}
    np.lines.forEach(l=>{if(!l.goi)l.goi=goiTuChu([np.soPhieu,np.ghiChu].join(' '))||goiTuDong(l.maVT,{pxGoc:np.pxGoc,xuat:!isN,kho:np.kho,ngay:new Date(np.ngay),exclId:np.id})});
    {const cg=np.lines.filter(l=>!l.goi);if(cg.length&&!confirm(`${cg.length} dòng chưa xác định được gói thầu (${cg.map(l=>l.maVT).join(', ')}). Vẫn lưu và phân gói sau?`))return}
    if(!isN){const vt=kiemTraVuotTon(np);if(vt.length&&!confirm('Xuất vượt tồn kho:\n'+vt.map(x=>`${x.vt}: xuất ${fmtN(x.sl)}, tồn ${fmtN(x.ton)}`).join('\n')+'\n\nVẫn lưu? (nên tạo phiếu nhập trước)'))return}
    if(p)Object.assign(p,np);else S[kind].push(np);
    capNhatDMVT(lines);await ctl.commit(np.id);await save(kind,'dmvt');dlg.close();render()};
}

/* ================== THẺ KHO ================== */
function moTheKho(maVT,goi){

const SEL={};const selSet=v=>SEL[v]||(SEL[v]=new Set());const selN=v=>selSet(v).size;

function updDelBtn(v){const b=document.querySelector(`[data-delsel="${v}"]`);if(b){b.hidden=!selN(v);b.textContent=`Xóa ${selN(v)} mục đã chọn`}const d=document.querySelector(`[data-duyet="${v}"]`);if(d){d.hidden=!selN(v);d.textContent=`Duyệt ${selN(v)} mục đã chọn`}}
function bindSel(){

  document.querySelectorAll('#main input.selall').forEach(a=>a.onchange=()=>{const v=a.dataset.sv;document.querySelectorAll(`#main input.sel[data-sv="${v}"]`).forEach(c=>{c.checked=a.checked;a.checked?selSet(v).add(c.dataset.sel):selSet(v).delete(c.dataset.sel)});updDelBtn(v)});
  document.querySelectorAll('#main [data-delsel]').forEach(b=>b.onclick=()=>xoaChon(b.dataset.delsel));
}
async function xoaChon(v){
  let ids=[...selSet(v)];if(!ids.length)return;
  if(ROLE()!=='admin'){const bo=ids.filter(id=>{const [l,r]=recOf(v,id);return!quyenSua(l,r)});if(bo.length){toast(`Bỏ qua ${bo.length} mục không có quyền xóa`,'Chỉ xóa được dữ liệu do mình nhập và chưa được duyệt.');ids=ids.filter(i=>!bo.includes(i))}if(!ids.length){selSet(v).clear();render();return}}
  if(!confirm(`Xóa ${ids.length} mục đã chọn? Thao tác không hoàn tác được (nên xuất sao lưu trước nếu chưa chắc).`))return;
  if(v==='suco'){S.suco=S.suco.filter(x=>!ids.includes(x.ma));await xoaDinhKem(f=>f.refType==='suco'&&ids.includes(f.refId));await save('suco')}
  else if(v==='pn'||v==='px'||v==='nh'){const k=v==='px'?'px':'pn';S[k]=S[k].filter(p=>!ids.includes(p.id));await xoaDinhKem(f=>f.refType===k&&ids.includes(f.refId));await save(k)}
  else if(v==='goi'||v==='kh'||v==='kln'){S[v]=S[v].filter(x=>!ids.includes(x.id));await save(v)}
  else if(v==='cp'){const by={};ids.forEach(s=>{const [pid,i]=s.split('|');(by[pid]||(by[pid]=[])).push(+i)});
    for(const [pid,arr] of Object.entries(by)){const p=S.px.find(x=>x.id===pid);if(!p)continue;arr.sort((a,b)=>b-a).forEach(i=>p.lines.splice(i,1));if(!p.lines.length){S.px=S.px.filter(x=>x!==p);await xoaDinhKem(f=>f.refType==='px'&&f.refId===pid)}}
    await save('px')}
  else if(v==='vt'){const dung=new Set([...S.pn,...S.px].flatMap(p=>p.lines.map(l=>l.maVT)));const bo=ids.filter(i=>dung.has(i));S.dmvt=S.dmvt.filter(d=>!ids.includes(d.maVT)||dung.has(d.maVT));await save('dmvt');
    if(bo.length)toast(`Không xóa được ${bo.length} vật tư`,'Các vật tư này đã có phiếu nhập hoặc xuất. Xóa các phiếu liên quan trước: '+bo.join(', '))}
  selSet(v).clear();render();
}

  const del={suco:S.suco.filter(x=>x._b===b).map(x=>x.ma),pn:S.pn.filter(x=>x._b===b).map(x=>x.id),px:S.px.filter(x=>x._b===b).map(x=>x.id)};

/* ================== CHỤP ẢNH BẰNG CAMERA ================== */
function chupAnh(){
  if(chamTay())return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');i.onchange=()=>res([...i.files]);i.addEventListener('cancel',()=>res([]));i.click()});
  return new Promise(async resolve=>{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Trình duyệt không mở được camera. Dùng "Chọn ảnh, file" thay thế.');return resolve([])}
    const dlg=document.createElement('dialog');dlg.style.width='min(900px,96vw)';
    dlg.innerHTML=`<div style="padding:12px 14px"><video autoplay playsinline muted style="width:100%;max-height:68vh;background:#000;display:block;border-radius:4px"></video><div class="bar" style="margin:10px 0 0;justify-content:space-between"><span class="muted" data-n>Đưa chứng từ vào khung, giữ thẳng và đủ sáng.</span><span class="bar" style="margin:0"><button class="b p" type="button" data-a="shot">Chụp</button><button class="b" type="button" data-a="done">Xong</button></span></div></div>`;
    document.body.appendChild(dlg);dlg.showModal();const shots=[];let stream=null;
    const done=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());dlg.close();dlg.remove();resolve(shots)};
    dlg.addEventListener('cancel',e=>{e.preventDefault();done()});dlg.querySelector('[data-a=done]').onclick=done;
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}})}catch(e){alert('Không mở được camera: '+e.message);return done()}
    const v=dlg.querySelector('video');v.srcObject=stream;
    dlg.querySelector('[data-a=shot]').onclick=async()=>{if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));
      shots.push(new File([b],`chup-${ymd(new Date())}-${uid()}.jpg`,{type:'image/jpeg'}));dlg.querySelector('[data-n]').textContent=`Đã chụp ${shots.length} ảnh. Chụp tiếp hoặc bấm Xong.`};
  });
}

  if(ty==='d')return`<input type="date" data-e="${id}" data-f="${k}" data-t="d" value="${x[k]?ymd(x[k]):''}">`;
  if(ty==='ky')return`<input data-e="${id}" data-f="${k}" data-t="ky" value="${esc(kyHien(x[k]))}" style="width:80px">`;
  if(ty==='b')return`<input type="checkbox" data-e="${id}" data-f="${k}" data-t="b"${x[k]!==false?' checked':''}>`;
  if(ty==='nhom'){const eff=x.nhom||(t!=='goi'?nhomCV(x.maCV):'');return`<select data-e="${id}" data-f="nhom">${opts([['','– chưa –'],['DTTX','Thường xuyên'],['DTKTX','Không TX']],x.nhom||'')}</select>${!x.nhom&&eff?`<span class="muted" style="font-size:12px"> theo gói: ${eff==='DTTX'?'TX':'KTX'}</span>`:''}${x.nhomGoiY?' <span class="pill pa">đề xuất</span>':''}`}

    <select id="khNhom">${opts([['DTTX','Thường xuyên'],['DTKTX','Không thường xuyên'],['CHUA','Chưa phân nhóm']],KHV.nhom,'Tất cả nhóm')}</select>

  <p class="muted" style="margin:0 0 8px">${n} dòng${n>500?' (hiển thị 500)':''}${t==='goi'?`, tổng giá trị gói ${fmtN(tongGT,0)} đ`:''}</p>

/* ================== MÁY CHỦ CHUNG, ĐĂNG NHẬP, PHÂN QUYỀN ================== */
const SERVER_URL='';// Có thể dán sẵn địa chỉ /exec của máy chủ vào đây
const SRV={url:'',token:'',user:null,rev:0,shadow:{},on:false,busy:false,loi:'',lanCuoi:null,cho:0};
const ROLE_TEN={admin:'Quản trị',nhaplieu:'Nhập liệu',theodoi:'Theo dõi'};
const ROLE=()=>SRV.on&&SRV.user?SRV.user.vaiTro:'admin';
const ME=()=>SRV.user?SRV.user.u:'';
const SYNC_T={suco:'ma',pn:'id',px:'id',kln:'id',kh:'id',goi:'id',dmvt:'maVT',files:'id',log:'id'};
const cfgSync=()=>{const c={...S.cfg};delete c.aiKey;delete c.aiModel;return c};
async function goiSV(action,data={}){
  let res;
  try{res=await fetch(SRV.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:SRV.token,...data})})}
  catch(e){throw new Error('Không kết nối được máy chủ (mất mạng hoặc sai địa chỉ)')}
  if(!res.ok)throw new Error('Máy chủ báo lỗi '+res.status);
  let j;try{j=await res.json()}catch(e){throw new Error('Máy chủ trả dữ liệu không hợp lệ. Kiểm tra lại địa chỉ /exec và quyền "Bất kỳ ai".')}
  if(!j.ok){if(j.hetPhien)hetPhien();throw new Error(j.loi||'Lỗi máy chủ')}
  return j;
}
function danDau(ks){
  if(!SRV.on)return;const now=new Date().toISOString(),R=ROLE();
  for(const k of ks){if(!SYNC_T[k])continue;for(const r of S[k]){if(r._by)continue;r._by=ME();r._byTen=SRV.user.hoTen;r._at=now;
    if(R!=='admin'){if(k==='pn'||k==='px')r.duyet=false;if(k==='kln')r.xacNhan=false;if(k==='suco')r.trangThai='Mới'}}}
}
function tinhThayDoi(){
  const ch=[],seen=new Set();
  for(const k of Object.keys(SYNC_T)){for(const r of S[k]){const id=r[SYNC_T[k]];if(id==null||id==='')continue;const key=k+'|'+id;if(seen.has(key))continue;seen.add(key);const j=JSON.stringify(r);if(SRV.shadow[key]!==j)ch.push({loai:k,id:String(id),data:r,key,j})}}
  if(ROLE()==='admin'){const jc=JSON.stringify(cfgSync());if(SRV.shadow['cfg|main']!==jc)ch.push({loai:'cfg',id:'main',data:cfgSync(),key:'cfg|main',j:jc})}
  for(const key of Object.keys(SRV.shadow))if(!seen.has(key)&&!key.startsWith('cfg|'))ch.push({loai:key.split('|')[0],id:key.slice(key.indexOf('|')+1),data:null,key});
  return ch;
}
function apDungTuXa(list){
  const dirty=new Set();
  for(const c of list){
    const key=c.loai+'|'+c.id;
    if(c.loai==='cfg'){if(c.data){const k0=S.cfg.aiKey,m0=S.cfg.aiModel;S.cfg=Object.assign(structuredClone(DEF_CFG),c.data,{aiKey:k0,aiModel:m0});S.cfg.nhip=Object.assign({},DEF_CFG.nhip,S.cfg.nhip);SRV.shadow[key]=JSON.stringify(cfgSync());DB.set('cfg',S.cfg).catch(()=>{})}continue}
    const k=c.loai;if(!SYNC_T[k])continue;const f=SYNC_T[k],arr=S[k],i=arr.findIndex(r=>String(r[f])===String(c.id));
    if(c.xoa||!c.data){if(i>=0){arr.splice(i,1);if(k==='files')delBlob(c.id)}delete SRV.shadow[key]}
    else{if(i>=0)arr[i]=c.data;else arr.push(c.data);SRV.shadow[key]=JSON.stringify(c.data)}
    dirty.add(k);
  }
  for(const k of dirty)DB.set(k,S[k]).catch(()=>{});
}
let henT=null;
function hen(ms=1500){if(!SRV.on)return;clearTimeout(henT);henT=setTimeout(dongBo,ms)}
async function taiAnhLen(){
  // Đưa ảnh, file lên Drive sau khi dữ liệu đã đồng bộ; lỗi ảnh không chặn dữ liệu
  if(ROLE()==='theodoi')return;let doi=false,n=0;
  for(const f of S.files){if(f.driveId||f._khongTai||(f._loiTai||0)>=3)continue;if(n>=6)break;
    const b=await getBlob(f.id);if(!b)continue;if(b.size>15*1048576){f._khongTai=1;doi=true;continue}
    try{const r=await goiSV('upload',{id:f.id,name:f.ten,type:f.type,b64:await toB64(b)});f.driveId=r.driveId;doi=true;n++}catch(e){f._loiTai=(f._loiTai||0)+1;doi=true;SRV.loiAnh=e.message}}
  if(doi){await DB.set('files',S.files);const ch=tinhThayDoi().filter(c=>c.loai==='files');if(ch.length){const r=await goiSV('push',{changes:ch.map(c=>({loai:c.loai,id:c.id,data:c.data}))});ch.forEach(c=>{if(c.data)SRV.shadow[c.key]=c.j;else delete SRV.shadow[c.key]});if(r.moi&&r.moi.length)apDungTuXa(r.moi)}}
  SRV.anhCho=S.files.filter(f=>!f.driveId&&!f._khongTai&&(f._loiTai||0)<3).length;
}
async function dongBo(){
  if(!SRV.on)return;if(SRV.busy){hen(4000);return}
  SRV.busy=true;veTT();
  try{
    if(ROLE()!=='theodoi'){
      const ch=tinhThayDoi();SRV.cho=ch.length;
      for(let i=0;i<ch.length;i+=150){
        const part=ch.slice(i,i+150);
        const r=await goiSV('push',{changes:part.map(c=>({loai:c.loai,id:c.id,data:c.data}))});
        part.forEach(c=>{if(c.data)SRV.shadow[c.key]=c.j;else delete SRV.shadow[c.key]});
        if(r.moi&&r.moi.length)apDungTuXa(r.moi);
        if(r.tuChoi&&r.tuChoi.length)toast('Máy chủ không chấp nhận '+r.tuChoi.length+' thay đổi',r.tuChoi.slice(0,6).map(x=>`${x.id}: ${x.ly}`).join('\n'));
        SRV.cho=Math.max(0,SRV.cho-part.length);
      }
    }
    const r=await goiSV('pull',{since:SRV.rev});
    if(r.user&&JSON.stringify(r.user)!==JSON.stringify(SRV.user)){SRV.user=r.user;await DB.set('srv_user',r.user);apDungVaiTro()}
    if(r.changes.length)apDungTuXa(r.changes);
    SRV.rev=r.rev;await DB.set('srv_rev',r.rev);
    if(r.changes.length&&!$('#dlg').open&&!$('#viewer').open&&!(document.activeElement&&document.activeElement.matches('input,select,textarea')))render();
    SRV.loi='';SRV.lanCuoi=new Date();
    try{await taiAnhLen()}catch(e){}
  }catch(e){SRV.loi=e.message}
  finally{SRV.busy=false;await DB.set('srv_shadow',SRV.shadow).catch(()=>{});veTT();const bn=$('#dbBan');if(bn)bn.outerHTML=bangDongBo()}
}
async function dongBoNgay(btn){if(!SRV.on){manDangNhap('');return}if(btn){btn.disabled=true;btn.textContent='Đang đồng bộ…'}SRV.busy=false;await dongBo();if(SRV.loi)toast('Chưa đồng bộ được',SRV.loi);else toast('Đã đồng bộ',`Lúc ${new Date().toTimeString().slice(0,5)}${SRV.anhCho?` · còn ${SRV.anhCho} ảnh đang gửi`:''}`,'g');render()}

  const cho=tinhThayDoi().length;if(cho||SRV.busy)return`<div class="msg a db-ban" id="dbBan">${SRV.busy?'Đang đồng bộ…':`${cho} thay đổi chưa gửi lên máy chủ.`} <button class="b" type="button" data-dbngay>Đồng bộ ngay</button></div>`;

   <p class="muted">Địa chỉ máy chủ: <span style="word-break:break-all">${esc(SRV.url)}</span></p>
   <div class="bar" style="margin:0"><button class="b p" type="button" id="dbNgay">Đồng bộ ngay</button><button class="b" type="button" id="dbLai">Tải lại toàn bộ từ máy chủ</button></div>`
  :`<div class="msg r">Máy này đang ở chế độ một máy: dữ liệu không đồng bộ. Đăng nhập máy chủ chung để điện thoại và máy tính dùng chung dữ liệu.</div><div class="bar" style="margin:0"><button class="b p" type="button" id="dbKet">Kết nối máy chủ, đăng nhập</button></div>`}</div>`;

function veTT(){
  const md=$('#mSync');if(md){md.className=!SRV.on?'':SRV.busy?'dang':SRV.loi?'loi':'ok';md.title=SRV.loi||''}

function suaUser(u){
  const moi=!u;u=u||{u:'',hoTen:'',vaiTro:'nhaplieu',phamVi:'',trangThai:'Hoạt động'};
  $('#dlgForm').innerHTML=`<h2 style="margin:0 0 10px">${moi?'Thêm tài khoản':'Sửa tài khoản '+esc(u.u)}</h2><div class="grid">
  <label>Tên đăng nhập<input name="u" value="${esc(u.u)}" ${moi?'':'readonly'} placeholder="vd: dv.binh" autocapitalize="none"></label><label>Họ tên<input name="hoTen" value="${esc(u.hoTen)}"></label>
  <label>Vai trò<select name="vaiTro">${opts([['nhaplieu','Nhập liệu'],['theodoi','Theo dõi'],['admin','Quản trị']],u.vaiTro)}</select></label>
  <label>Phạm vi quận (trống = tất cả)<input name="phamVi" value="${esc(u.phamVi)}" list="dsQuanTK" placeholder="vd: Quận 3, Quận 10"></label>
  ${moi?'<label>Mật khẩu ban đầu (tối thiểu 6 ký tự)<input name="p" value=""></label>':`<label>Trạng thái<select name="trangThai">${opts(['Hoạt động','Khóa'],u.trangThai)}</select></label>`}
  </div><datalist id="dsQuanTK">${quans().map(q=>`<option value="${esc(q)}">`).join('')}</datalist>
  <p class="muted">Nhập liệu: ghi nhận sự cố, lập phiếu, ghi khối lượng; sửa, xóa được dữ liệu của mình khi chưa duyệt. Theo dõi: chỉ xem và xuất Excel. Quản trị: toàn quyền.</p><div id="dlgMsg"></div>
  <div class="bar" style="margin:14px 0 0;justify-content:flex-end"><button class="b" value="cancel">Đóng</button><button class="b p" type="button" id="tkLuu">Lưu</button></div>`;
  const dlg=moDialog();
  $('#tkLuu').onclick=async()=>{const d=Object.fromEntries(new FormData($('#dlgForm')));if(!moi)d.u=u.u;
    try{const r=await goiSV('userSave',{user:d});DSU=r.users;dlg.close();render();toast(moi?'Đã tạo tài khoản':'Đã lưu tài khoản',moi?`Gửi cho người dùng: tên ${d.u.toLowerCase()}, mật khẩu tạm như đã nhập, kèm liên kết mời.`:'','g')}
    catch(e){$('#dlgMsg').innerHTML=`<div class="msg r">${esc(e.message)}</div>`}};
}

function moHelp(v){
  const h=HELP[v]||HELP.huongdan,R=ROLE();
  $('#dlgForm').innerHTML=`<h2 style="margin:0 0 4px">Hướng dẫn: ${esc(h.t)}</h2><p class="muted" style="margin:0 0 10px">${esc(h.md)}</p><ol class="hl">${h.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
  ${h.q.admin?`<h3 style="font-size:15px;margin:14px 0 6px">Quyền theo vai trò</h3><div class="tw"><table><tbody>${['admin','nhaplieu','theodoi'].map(r=>`<tr${r===R?' style="background:var(--amber-soft)"':''}><td><b>${ROLE_TEN[r]}</b>${r===R&&SRV.on?' (bạn)':''}</td><td class="w">${esc(h.q[r])}</td></tr>`).join('')}</tbody></table></div>`:''}
  <div class="bar" style="margin:14px 0 0;justify-content:flex-end"><button class="b" type="button" id="hAll">Xem toàn bộ hướng dẫn</button><button class="b p" value="cancel">Đóng</button></div>`;
  const dlg=moDialog();$('#hAll').onclick=()=>{dlg.close();go('huongdan')};

  let L=PSV.loc<0?PS.rows:PSV.loc===9?PS.rows.filter(r=>r.canKT.length):PS.rows.filter(r=>r.nhom===PSV.loc);L=psSort(L);
  const H=PSV.hdr;
  return`<h1>Phân tách, in phiếu sửa</h1><p class="sub">Đưa danh sách sự cố vào (file Export, Excel, ảnh chụp danh sách, tin nhắn Zalo hoặc sự cố đang mở trong app). App tự chia thành 4 nhóm: đèn tắt; chóa, thân đèn; rẽ nhánh, RCBO; tủ điều khiển. App tách sẵn số trụ, loại đèn rồi in hoặc xuất phiếu sửa theo mẫu. Dùng được hoàn toàn trên điện thoại.</p>
  <div class="card"><h2 style="margin-top:0">1. Đưa dữ liệu vào</h2>
    <div class="bar" style="margin:0"><button class="b" type="button" id="psCam">Chụp ảnh</button><label class="b p">Chọn file Excel, ảnh, PDF<input type="file" id="psFi" multiple accept=".xlsx,.xls,.csv,.docx,.pdf,image/*" hidden></label><button class="b" type="button" id="psSC">Lấy sự cố đang mở</button></div>
    <details style="margin-top:10px"><summary>Dán nội dung (tin nhắn Zalo, copy từ Excel)</summary><textarea id="psTxt" rows="5" style="width:100%;margin-top:6px" placeholder="Mỗi dòng một sự cố, ví dụ: TS14 CV Tao Đàn tắt led 20w"></textarea><div class="bar" style="margin:6px 0 0"><input id="psTuDan" placeholder="Tủ điều khiển (nếu cùng một tủ)" list="dsTuPS" style="flex:1"><button class="b p" type="button" id="psDan">Phân tách</button></div></details>
    <div id="psMsg"></div>
    <p class="muted" style="margin:8px 0 0">Ảnh chụp đọc chính xác nhất khi bật AI ở Cài đặt; không có AI, app dùng OCR miễn phí nên cần kiểm tra lại từng dòng.</p></div>
  <div class="card"><h2 style="margin-top:0">2. Kiểm tra kết quả: ${PS.rows.length} sự cố</h2>
    <div class="chips"><button class="b${PSV.loc<0?' p':''}" data-loc="-1">Tất cả ${PS.rows.length}</button>${PS_NHOM.map((t,g)=>`<button class="b${PSV.loc===g?' p':''}" data-loc="${g}">${t} ${cnt[g]}</button>`).join('')}${kt?`<button class="b${PSV.loc===9?' p':''}" data-loc="9">⚠ Cần kiểm tra ${kt}</button>`:''}</div>
    <div class="psl">${L.map(r=>`<div class="psr${r.canKT.length?' vang':''}"><div class="psh"><b>${esc(r.tu||'(chưa rõ tủ)')}</b><span class="muted">${esc(r.duong)}</span>${r.ma?`<span class="pill pg">${esc(r.ma)}</span>`:''}<button class="b d x" type="button" data-pdel="${r.id}" aria-label="Xóa dòng">✕</button></div>
      <div class="psn">${esc(r.nd)}</div>
      <div class="psf"><select data-pi="${r.id}" data-pf="nhom">${PS_NHOM.map((t,g)=>`<option value="${g}"${g===r.nhom?' selected':''}>${t}</option>`).join('')}</select><label>Trụ <input data-pi="${r.id}" data-pf="tru" value="${esc(r.tru)}"></label>${r.nhom===0?`<label>Đèn <input data-pi="${r.id}" data-pf="den" value="${esc(r.den)}"></label>`:''}<label>Tuyến <input data-pi="${r.id}" data-pf="duong" value="${esc(r.duong)}"></label></div>
      ${r.canKT.map(k=>`<span class="pill pa">${esc(k)}</span>`).join(' ')}</div>`).join('')||'<p class="muted">Chưa có dữ liệu. Làm bước 1.</p>'}</div>
    ${PS.rows.length?'<div class="bar" style="margin:10px 0 0"><button class="b d" type="button" id="psXoa">Xóa toàn bộ danh sách</button></div>':''}</div>
  <div class="card"><h2 style="margin-top:0">3. In, xuất phiếu</h2>
    <div class="grid"><label>Tháng<input id="psThang" value="${esc(H.thang)}"></label><label>Ngày sửa (để trống để ghi tay)<input type="date" id="psNgay" value="${esc(H.ngay)}"></label><label class="full">Nhóm sửa gồm (để trống để ghi tay)<input id="psTo" value="${esc(H.to)}"></label>
    <label class="full">Tên đơn vị (3 dòng đầu phiếu)<textarea id="psDV" rows="3">${esc(H.dv)}</textarea></label></div>
    <p style="margin:10px 0 4px">Chọn phiếu cần in:</p><div class="chips">${PS_NHOM.map((t,g)=>`<label class="b"><input type="checkbox" data-psel="${g}"${PSV.sel.includes(g)?' checked':''}${cnt[g]?'':' disabled'}> ${t} (${cnt[g]})</label>`).join('')}</div>
    <div class="bar" style="margin:12px 0 0"><button class="b p" type="button" id="psIn">In phiếu, lưu PDF</button><button class="b" type="button" id="psExcel">Xuất Excel theo mẫu</button></div>
    <div class="bar qe" style="margin:10px 0 0"><button class="b p" type="button" id="psKQ">Nhập kết quả phiếu sửa đã ghi tay</button></div>
    <div class="bar qe" style="margin:10px 0 0"><input id="psQuan" placeholder="Quận (để ghi vào danh sách sự cố)" value="${esc(H.quan)}" list="dsQuanPS"><button class="b" type="button" id="psGhi">Ghi vào danh sách sự cố</button></div>
    <p class="muted" style="margin:8px 0 0">Trên điện thoại: "In phiếu" mở hộp in của máy, chọn máy in hoặc "Lưu dưới dạng PDF" rồi gửi qua Zalo. "Xuất Excel" mở bảng chia sẻ để gửi file hoặc lưu vào máy.</p></div>`;
};
after.phieusua=()=>{
  const dl=(id,a)=>{const e=$('#'+id);if(e)e.innerHTML=[...new Set(a.filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')};dl('dsTuPS',S.suco.map(x=>x.tu).concat(PS.rows.map(r=>r.tu)));dl('dsQuanPS',quans());
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js').catch(()=>{});
  $('#psFi').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)psDocFile(f)};
  $('#psCam').onclick=async()=>{const f=await chupAnh();if(f.length)psDocFile(f)};
  $('#psSC').onclick=()=>{const L=S.suco.filter(x=>!DONE.includes(x.trangThai)).map(x=>({tu:x.tu||(x.nguon==='1022'?'Sự cố 1022':''),duong:x.diaChi,nd:x.hienTuong,tru:x.tru,ma:x.ma,thang:String(new Date(x.tn).getMonth()+1)}));const k=psNap(L);render();$('#psMsg').innerHTML=`<div class="msg g">Đã thêm ${k.them} sự cố đang mở${k.trung?`, bỏ qua ${k.trung} đã có`:''}.</div>`};
  $('#psDan').onclick=()=>{const tx=$('#psTxt').value;if(!tx.trim())return;const r=textToRows(TG.ps,tx);const tu=$('#psTuDan').value.trim();if(tu)r.rows.forEach(o=>{if(!o.tu)o.tu=tu});const k=psNap(r.rows);render();$('#psMsg').innerHTML=`<div class="msg ${k.them?'g':'r'}">Đã thêm ${k.them} sự cố${k.trung?`, bỏ qua ${k.trung} dòng trùng`:''}.</div>`};
  document.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{PSV.loc=+b.dataset.loc;render()});
  document.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{PS.rows=PS.rows.filter(r=>r.id!==b.dataset.pdel);psLuu();render()});
  document.querySelectorAll('[data-pi]').forEach(inp=>inp.onchange=()=>{const r=PS.rows.find(x=>x.id===inp.dataset.pi);if(!r)return;const f=inp.dataset.pf;r[f]=f==='nhom'?+inp.value:inp.value.trim();psKT(r);psLuu();if(f==='nhom'||f==='duong')render()});
  const x=$('#psXoa');if(x)x.onclick=()=>{if(confirm('Xóa toàn bộ danh sách đang phân tách? (Sự cố đã ghi vào Danh sách sự cố không bị xóa.)')){PS.rows=[];PSV.loc=-1;psLuu();render()}};
  const hd=()=>{PSV.hdr.thang=$('#psThang').value.trim();PSV.hdr.ngay=$('#psNgay').value;PSV.hdr.to=$('#psTo').value.trim();PSV.hdr.dv=$('#psDV').value.trim()||PSV.hdr.dv;psLuu()};
  ['#psThang','#psNgay','#psTo','#psDV'].forEach(s=>$(s).onchange=hd);
  document.querySelectorAll('[data-psel]').forEach(c=>c.onchange=()=>{const g=+c.dataset.psel;PSV.sel=c.checked?[...new Set([...PSV.sel,g])]:PSV.sel.filter(x=>x!==g)});
  $('#psIn').onclick=()=>{hd();psIn()};
  $('#psExcel').onclick=async()=>{hd();const b=$('#psExcel');b.disabled=true;b.textContent='Đang tạo file…';try{await psXuatExcel()}catch(e){toast('Không xuất được Excel',e.message)}finally{b.disabled=false;b.textContent='Xuất Excel theo mẫu'}};
  $('#psGhi').onclick=psGhiSC;$('#psKQ').onclick=nhapKQPS;
};
HELP.phieusua={t:'Phân tách, in phiếu sửa',md:'Đưa danh sách sự cố vào, app tự chia nhóm và in phiếu sửa theo mẫu.',b:['Bước 1: chọn file Export hoặc Excel bất kỳ có cột Tên tủ, Đường, Tháng, Nội dung; hoặc chụp ảnh danh sách; hoặc dán tin nhắn Zalo (mỗi dòng một sự cố); hoặc "Lấy sự cố đang mở".','App tự chia 4 nhóm: đèn tắt, chớp, mờ; hư chóa, thân đèn; hư rẽ nhánh, RCBO, hộp liên thông; tủ điều khiển. Tự tách số trụ (TS14, trụ số 1(9)…) và loại đèn (LED 20W ×2, MH 70W, HPS 150W).','Bước 2: bấm các nút nhóm để xem. Dòng viền vàng cần kiểm tra (chưa rõ tủ, tuyến hoặc số trụ). Sửa nhóm, số trụ, loại đèn ngay trên thẻ; bấm ✕ để xóa dòng sai.','Bước 3: điền tháng, nhóm sửa, ngày sửa (hoặc để trống để ghi tay), chọn phiếu cần in, bấm "In phiếu, lưu PDF" hoặc "Xuất Excel theo mẫu".','Có thể bấm "Ghi vào danh sách sự cố" để lưu các sự cố này vào app theo dõi tiếp. Mã sự cố được in vào cột Ghi chú để sau này đối chiếu tự động.','Sau khi tổ sửa xong: bấm "Nhập kết quả phiếu sửa đã ghi tay", chụp phiếu. App quy các cột Driver, Chống sét, Bóng, Ballast, Kích, Tụ, BCM, Đuôi đèn thành vật tư, rồi tạo khối lượng ngày, phiếu xuất bù phần chưa có phiếu, phiếu nhập thu hồi và chuyển sự cố sang Đã xử lý.','Danh sách đang làm được lưu trên máy, tắt app mở lại vẫn còn.'],q:{admin:'Toàn quyền.',nhaplieu:'Phân tách, in, xuất, ghi vào danh sách sự cố.',theodoi:'Phân tách, in, xuất; không ghi vào danh sách sự cố.'}};

/* ================== NHÓM MỤC CHÍNH, MỤC CON ================== */
const NHOM_MENU={hethong:{t:'Hệ thống',v:['taikhoan','import','caidat','huongdan']}};
const TEN_NGAN={import:'Lịch sử nạp',suco:'Danh sách',s1022:'1022',phieusua:'Phân tách, in',import:'Nhập dữ liệu',px:'Phiếu xuất',pn:'Phiếu nhập',nh:'Nhập hoàn',capphat:'Cấp phát',tonkho:'Tồn kho',vattu:'Đối chiếu',kehoach:'Kế hoạch, KL',sosanh:'Số còn lại',taikhoan:'Tài khoản',caidat:'Cài đặt',huongdan:'Hướng dẫn'};
const nhomCua=v=>Object.keys(NHOM_MENU).find(g=>NHOM_MENU[g].v.includes(v))||'';
const cuoiNhom={};
function vaoNhom(g){const N=NHOM_MENU[g];if(!N)return go(g);const ok=v=>{const b=document.querySelector(`#nav button[data-v="${v}"]`);return b&&getComputedStyle(b).display!=='none'};go(cuoiNhom[g]&&ok(cuoiNhom[g])?cuoiNhom[g]:N.v.find(ok)||N.v[0])}
function moNhomNav(v){const g=nhomCua(v);if(g)cuoiNhom[g]=v;document.querySelectorAll('#nav .ng').forEach(n=>{const on=n.dataset.g===g;if(on)n.classList.add('mo');else if(laDT())n.classList.remove('mo');n.querySelector('.nh').setAttribute('aria-expanded',n.classList.contains('mo'));n.querySelector('.nh').classList.toggle('co',on)})}
function capNhatNhomBadge(){document.querySelectorAll('#nav .ng').forEach(n=>{let t=0;n.querySelectorAll('.nsub .bd').forEach(b=>{if(!b.hidden)t+=parseInt(b.textContent,10)||0});const e=n.querySelector('[data-gbd]');e.hidden=!t;e.textContent=t})}
function thanhCon(v){const g=nhomCua(v);if(!g)return'';const L=NHOM_MENU[g].v.map(x=>{const b=document.querySelector(`#nav button[data-v="${x}"]`);if(!b)return'';const bd=b.querySelector('.bd');return`<button type="button" data-go="${x}" class="${x===v?'on ':''}${b.classList.contains('qa')?'qa':''}">${TEN_NGAN[x]||x}${bd&&!bd.hidden?`<em>${esc(bd.textContent)}</em>`:''}</button>`}).join('');return`<nav class="subtabs" aria-label="${NHOM_MENU[g].t}">${L}</nav>`}
document.querySelectorAll('#nav .nh').forEach(b=>b.onclick=()=>{const n=b.closest('.ng');const mo=!n.classList.contains('mo');if(laDT())document.querySelectorAll('#nav .ng').forEach(x=>x.classList.remove('mo'));n.classList.toggle('mo',mo);b.setAttribute('aria-expanded',mo)});

/* ================== KHÉP KÍN: TRẠNG THÁI, KẾT QUẢ SỬA CHỮA, PHIẾU SỬA, TRỪ KHO ================== */
const tinhKho=p=>!(S.cfg.truKhoKhiDuyet&&p.duyet===false);
function tuDongDangXuLy(){
  if(SRV.on&&ROLE()!=='admin')return 0;
  const dung=new Set();S.px.forEach(p=>{if(p.loai!=='Thi công')return;if(p.maSC)dung.add(p.maSC);p.lines.forEach(l=>l.maSC&&dung.add(l.maSC))});S.kln.forEach(k=>k.maSC&&dung.add(k.maSC));
  let n=0;S.suco.forEach(x=>{if(dung.has(x.ma)&&(x.trangThai==='Mới'||x.trangThai==='Đã phân công')){x.trangThai='Đang xử lý';n++}});return n;
}
const thuHoiMD=maVT=>{const th=String(S.cfg.thuHoi||'').split(',').map(s=>norm(s)).filter(Boolean);return th.some(p=>norm(maVT).startsWith(p))};
function goiYCV(text){const w=new Set(nds(text).split(/[^a-z0-9]+/).filter(t=>t.length>=3));return S.goi.filter(g=>g.maCV).map(g=>({g,sc:nds(g.tenCV).split(/[^a-z0-9]+/).filter(t=>t.length>=3&&w.has(t)).length})).sort((a,b)=>b.sc-a.sc||String(a.g.maCV).localeCompare(String(b.g.maCV)))}
const cvOpts=(sel,text)=>`<option value="">– chọn công việc –</option>`+goiYCV(text).map(({g,sc})=>`<option value="${esc(g.maCV)}"${g.maCV===sel?' selected':''}>${sc?'★ ':''}${esc(g.maCV)} – ${esc(g.tenCV)} (${esc(g.dvt||'')})</option>`).join('');
async function taoKetQua(items,o){
  const b=o.b||uid(),d=o.ngay,iso=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).toISOString(),R={kl:0,px:null,pn:null,sc:0};
  const xuatDaCo=(sc,vt)=>S.px.filter(p=>p.loai==='Thi công'&&tinhKho(p)).reduce((s,p)=>s+p.lines.filter(l=>l.maVT===vt&&(l.maSC||p.maSC)===sc).reduce((a,l)=>a+(+l.sl||0),0),0);
  const dungDaCo=(sc,vt)=>S.kln.filter(k=>(k.maSC||k.maCV)===sc&&k.maVT===vt).reduce((s,k)=>s+(k.slSD||0),0);
  const moi={},ten={},thL=[];
  items.forEach(it=>it.vt.forEach(v=>{if(!v.maVT||!(v.sl>0))return;const k=it.maSC+'|'+v.maVT;moi[k]=(moi[k]||0)+v.sl;ten[v.maVT]=v.ten||ten[v.maVT]||'';if(v.th>0)thL.push({maVT:v.maVT,tenVT:v.ten||'',dvt:'',sl:v.th,donGia:0,maSC:it.maSC})}));
  const buL=[];if(o.taoPX)Object.entries(moi).forEach(([k,sl])=>{const i=k.indexOf('|'),sc=k.slice(0,i),vt=k.slice(i+1);const thieu=dungDaCo(sc,vt)+sl-xuatDaCo(sc,vt);if(thieu>0)buL.push({maVT:vt,tenVT:ten[vt],dvt:'',sl:Math.min(thieu,sl),donGia:0,maSC:sc})});
  if(o.ghiKL)items.forEach(it=>{const g=S.goi.find(x=>x.maCV===it.maCV)||{};const base={ngay:iso,maSC:it.maSC===it.maCV?'':it.maSC,maCV:it.maCV||'',tenCV:g.tenCV||'',dvt:g.dvt||'',to:o.to||'',nhom:'',xacNhan:true,_b:b};
    const vs=it.vt.filter(v=>v.maVT&&v.sl>0);for(let i=0;i<Math.max(1,vs.length);i++){const v=vs[i];if(!v&&!(it.kl>0))continue;S.kln.push({id:uid(),...base,kl:i===0?(+it.kl||0):0,maVT:v?v.maVT:'',slSD:v?v.sl:0,slThuHoi:v?(+v.th||0):0});R.kl++}});
  const mk=(kind,loai,kho,lines,gc)=>{const scs=[...new Set(lines.map(l=>l.maSC))];const p={id:uid(),soPhieu:genSoPhieu(kind,iso),ngay:iso,loai,kho,maSC:scs.length===1?scs[0]:'',nguoi:o.to||'',ghiChu:gc,lines:lines.map(l=>({...l,maSC:scs.length===1?'':l.maSC})),_b:b};S[kind].push(p);capNhatDMVT(lines);return p};
  if(buL.length)R.px=mk('px','Thi công',o.kho||'Kho chính',buL,o.ghiChu||'Xuất bù theo kết quả sửa chữa');
  if(o.nhapTH&&thL.length)R.pn=mk('pn','Thu hồi','Kho thu hồi',thL,'Thiết bị cũ thu hồi theo kết quả sửa chữa');
  capNhatDMVT(Object.keys(ten).map(v=>({maVT:v,tenVT:ten[v],dvt:''})));
  if(o.dongSC&&(!SRV.on||ROLE()==='admin')){const now=new Date().toISOString();new Set(items.map(i=>i.maSC)).forEach(sc=>{const x=S.suco.find(s=>s.ma===sc);if(x&&!DONE.includes(x.trangThai)){x.trangThai='Đã xử lý';x.tgXong=now;R.sc++}})}
  await save('kln','px','pn','dmvt','suco');return R;
}
const tomTatKQ=R=>[R.kl?`${R.kl} dòng khối lượng ngày`:'',R.px?`phiếu xuất bù ${R.px.soPhieu} (${R.px.lines.length} dòng)`:'',R.pn?`phiếu nhập thu hồi ${R.pn.soPhieu}`:'',R.sc?`${R.sc} sự cố chuyển Đã xử lý`:''].filter(Boolean).join(', ')||'Không có dữ liệu mới';

/* ---- 2. Ghi kết quả sửa chữa cho một sự cố ---- */
function ketQuaSC(x){
  refreshLists();const txt=`${x.hienTuong||''} ${x.nguyenNhan||''}`;const g0=goiYCV(txt)[0];
  const K={cv:[{maCV:g0&&g0.sc?g0.g.maCV:'',kl:1}],vt:[{maVT:'',sl:1,th:0}],ngay:ymd(new Date()),to:x.nguoi||'',kho:'Kho chính'};
  const daXuat=S.px.filter(p=>p.loai==='Thi công').flatMap(p=>p.lines.filter(l=>(l.maSC||p.maSC)===x.ma).map(l=>`${l.tenVT||l.maVT} ×${fmtN(l.sl)} (${p.soPhieu})`));
  const coKL=S.kln.filter(k=>k.maSC===x.ma).length;const A=!SRV.on||ROLE()==='admin';const f=$('#dlgForm');
  const doc=()=>{K.ngay=$('#kqNgay').value;K.to=$('#kqTo').value.trim();K.kho=$('#kqKho').value.trim()||'Kho chính';
    K.cv=[...f.querySelectorAll('[data-kc]')].map(r=>({maCV:r.querySelector('select').value,kl:numLoose(r.querySelector('input').value)||0}));
    K.vt=[...f.querySelectorAll('[data-kv]')].map(r=>{const i=r.querySelectorAll('input');const ma=normMa(i[0].value);const d=S.dmvt.find(z=>z.maVT===ma);return{maVT:ma,ten:d?d.tenVT:'',sl:numLoose(i[1].value)||0,th:numLoose(i[2].value)||0}})};
  const ve=()=>{f.innerHTML=`<h2 style="margin:0 0 4px">Kết quả sửa chữa ${esc(x.ma)}</h2><p class="muted" style="margin:0 0 10px">${esc(x.tu||'')} ${x.tru?'· trụ '+esc(x.tru):''} · ${esc(x.hienTuong||'')}</p>
    ${coKL?`<div class="msg a">Sự cố này đã có ${coKL} dòng khối lượng. Chỉ ghi thêm phần chưa ghi.</div>`:''}

const laLanh=p=>p.loai==='Thi công';
const _gm=(l,g)=>g===undefined||(l.goi||'')===g;
function daHoanPL(p,vt,g){return S.pn.filter(q=>q.loai==='Hoàn nhập'&&q.pxGoc===p.soPhieu).reduce((s,q)=>s+q.lines.filter(l=>l.maVT===vt&&_gm(l,g)).reduce((a,l)=>a+(+l.sl||0),0),0)}
function daDungPL(p,vt,g){
  const L=p.lines.filter(l=>l.maVT===vt&&_gm(l,g));if(L.length&&L.every(l=>l.dd!=null&&l.dd!==''))return L.reduce((s,l)=>s+(+l.dd||0),0);
  const key=g===undefined?vt:vt+'|'+g;
  const h=S.pn.filter(q=>q.loai==='Hoàn nhập'&&q.pxGoc===p.soPhieu&&q.qtDung&&(q.qtDung[key]!=null||q.qtDung[vt]!=null)).sort((a,b)=>Date.parse(b._at||b.ngay)-Date.parse(a._at||a.ngay))[0];
  return h?+(h.qtDung[key]!=null?h.qtDung[key]:h.qtDung[vt]):null;
}
const nhieuGoiVT=(p,vt)=>new Set(p.lines.filter(l=>l.maVT===vt).map(l=>l.goi||'')).size>1;
function treoPL(p){
  const M=new Map();p.lines.forEach(l=>{const k=l.maVT+'|'+(l.goi||'');const r=M.get(k)||{maVT:l.maVT,goi:l.goi||'',tenVT:l.tenVT||'',dvt:l.dvt||'',xuat:0};r.xuat+=+l.sl||0;M.set(k,r)});
  const R=[...M.values()].map(r=>{r.gk=nhieuGoiVT(p,r.maVT)?r.goi:undefined;r.hoan=daHoanPL(p,r.maVT,r.gk);r.dung=daDungPL(p,r.maVT,r.gk);r.qt=r.dung!=null;r.con=Math.max(0,r.xuat-(r.dung||0)-r.hoan);return r});
  const qt=R.every(r=>r.qt),con=R.reduce((s,r)=>s+r.con,0);
  return{rows:R,qt,con,tt:con<=0&&(qt||R.every(r=>r.hoan>=r.xuat))?'xong':!qt?'chua':'con'};
}
const TT_PL={xong:['Đã xong','pg'],con:['Còn phải hoàn','pa'],chua:['Chưa quyết toán','pn']};
function treoTheoVTG(){const T={};S.px.filter(laLanh).forEach(p=>{const t=treoPL(p);if(t.tt==='xong')return;t.rows.forEach(r=>{if(r.con>0){const k=r.maVT+'|'+r.goi;T[k]=(T[k]||0)+r.con}})});return T}

    ${D.map((r,i)=>`<tr><td>${esc(r.tenVT||r.maVT)} ${pillGoi(r.goi)}<br><span class="muted">${esc(r.maVT)} ${esc(r.dvt)}</span></td><td class="n">${fmtN(r.xuat)}</td><td class="n">${fmtN(r.hoan)}</td><td><input data-dd="${i}" value="${r.in}" inputmode="decimal" style="width:70px" placeholder="0"></td><td class="n"><b data-con="${i}">${fmtN(Math.max(0,r.xuat-(numLoose(r.in)||0)-r.hoan))}</b></td></tr>`).join('')}
    </tbody></table></div>
    <div class="bar" style="margin:8px 0 0"><button class="b" type="button" id="qtHet">Dùng hết</button><button class="b" type="button" id="qtKhong">Chưa dùng gì (hoàn hết)</button></div>
    ${sua?'':'<div class="msg a">Phiếu đã duyệt hoặc do người khác lập: số đã dùng được lưu kèm phiếu nhập hoàn.</div>'}
    <div id="dlgMsg"></div><div class="bar" style="margin:14px 0 0;justify-content:flex-end"><button class="b" value="cancel">Đóng</button>${sua?'<button class="b" type="button" id="qtLuu">Chỉ lưu số đã dùng</button>':''}<button class="b p" type="button" id="qtHoan">Lưu và nhập hoàn phần còn lại</button></div>`;

    f.querySelectorAll('[data-dd]').forEach(i=>i.oninput=tinh);
    $('#qtHet').onclick=()=>{D.forEach(r=>r.in=Math.max(0,r.xuat-r.hoan));ve()};$('#qtKhong').onclick=()=>{D.forEach(r=>r.in=0);ve()};
    const kt=()=>{tinh();for(const r of D){const v=numLoose(r.in);if(String(r.in).trim()===''){$('#dlgMsg').innerHTML='<div class="msg r">Ghi số đã dùng cho mọi dòng (0 nếu chưa dùng).</div>';return false}if(isNaN(v)||v<0||v>r.xuat-r.hoan+1e-9){$('#dlgMsg').innerHTML=`<div class="msg r">${esc(r.maVT)}: số đã dùng phải từ 0 đến ${fmtN(r.xuat-r.hoan)}.</div>`;return false}r.v=v}return true};
    const ghiDD=()=>{D.forEach(r=>{const L=p.lines.filter(l=>l.maVT===r.maVT&&(l.goi||'')===r.goi);let con=r.v;L.forEach((l,j)=>{const x=j===L.length-1?con:Math.min(con,+l.sl||0);l.dd=x;con-=x})})};
    const lu=$('#qtLuu');if(lu)lu.onclick=async()=>{if(!kt())return;ghiDD();await save('px');$('#dlg').close();toast('Đã lưu quyết toán '+p.soPhieu,'','g');render()};

      if(sua)ghiDD();const qtDung=Object.fromEntries(D.map(r=>[r.gk===undefined?r.maVT:r.maVT+'|'+r.goi,r.v]));
      if(lines.length){const now=new Date();const np={id:uid(),soPhieu:genSoPhieu('pn',now.toISOString(),'NH'),ngay:new Date(now.getFullYear(),now.getMonth(),now.getDate(),12).toISOString(),loai:'Hoàn nhập',kho:p.kho,maSC:p.maSC||'',nguoi:p.nguoi||'',ghiChu:'Hoàn phần còn lại của phiếu lãnh '+p.soPhieu,pxGoc:p.soPhieu,qtDung,lines};S.pn.push(np);capNhatDMVT(lines)}
      else if(!sua){$('#dlgMsg').innerHTML='<div class="msg a">Không còn vật tư phải hoàn.</div>';return}
      await save('px','pn','dmvt');$('#dlg').close();toast(lines.length?'Đã lập phiếu nhập hoàn':'Đã quyết toán',lines.length?`${p.soPhieu}: hoàn ${lines.length} vật tư về ${p.kho}. Tồn Động đã cộng lại.`:'Không còn phải hoàn.','g');render()};
  };
  moDialog();ve();
}
